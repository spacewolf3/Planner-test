<title>Family Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with tabs; one working column (max 1180px); week = 7 columns on desktop, stacked day cards on phones. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --sunk: #e8ecf0;
  --line: #d5dce3;
  --fg: #17212b;
  --muted: #5b6875;
  --accent: #1f6f78;
  --accent-ink: #ffffff;
  --accent-soft: #d8eced;
  --gap: #c4332b;
  --gap-soft: #fbe3e1;
  --ok: #2c7a4b;
  --na: #a3adb8;
  --o1: #1f8a8a; --o2: #d0683f; --o3: #7a5bc7; --o4: #c79a1e;
  --o5: #3f8f4f; --o6: #2f6fca; --o7: #c74a86; --o8: #607080;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 35, 50, .06), 0 4px 14px rgba(20, 35, 50, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19222a; --sunk: #222c35; --line: #2f3b46;
    --fg: #e6ecf1; --muted: #98a6b3; --accent: #5cc0c4; --accent-ink: #0d2427; --accent-soft: #1d3b3f;
    --gap: #ff7a70; --gap-soft: #3d1f1d; --ok: #6fcf94; --na: #5d6a76;
    --o1: #4cc2c0; --o2: #f08a5d; --o3: #a58bf0; --o4: #e6be48;
    --o5: #6cc27c; --o6: #6aa2f0; --o7: #ec7bb0; --o8: #95a5b5;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19222a; --sunk: #222c35; --line: #2f3b46;
  --fg: #e6ecf1; --muted: #98a6b3; --accent: #5cc0c4; --accent-ink: #0d2427; --accent-soft: #1d3b3f;
  --gap: #ff7a70; --gap-soft: #3d1f1d; --ok: #6fcf94; --na: #5d6a76;
  --o1: #4cc2c0; --o2: #f08a5d; --o3: #a58bf0; --o4: #e6be48;
  --o5: #6cc27c; --o6: #6aa2f0; --o7: #ec7bb0; --o8: #95a5b5;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 1.35rem; font-weight: 700; }
.brand .sync { font-size: .78rem; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 6px; scrollbar-width: none; }
nav.tabs a { padding: 9px 12px 10px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--gap); color: #fff; font-size: .72rem; text-align: center; line-height: 18px; }

main { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 18px; }
.banner { padding: 10px 14px; border-radius: var(--radius); background: var(--sunk); color: var(--fg); font-size: .9rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--gap-soft); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.empty { color: var(--muted); font-size: .9rem; padding: 6px 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: .9rem; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--gap); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; display: inline-grid; place-items: center; font-weight: 700; }

.today-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 820px) { .today-grid { grid-template-columns: 1fr; } }
.dayhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dayhead h2 { font-size: 1.6rem; }

/* care rows */
.kidrow { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.kidrow:first-of-type { border-top: 0; }
.kidname { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.kidname span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c, var(--o8)); }
.blocks { display: flex; flex-wrap: wrap; gap: 6px; }
.block { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 16%, var(--surface)); border-radius: 8px; padding: 4px 9px; min-width: 92px; text-align: left; }
.block .bl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.block .bo { font-weight: 600; font-size: .9rem; }
.block.gap { --c: var(--gap); background: var(--gap-soft); border-style: dashed; border-color: var(--gap); }
.block.gap .bo { color: var(--gap); }
.block.na { --c: var(--na); background: transparent; border-style: dotted; }
.block.na .bo { color: var(--muted); font-weight: 500; }
.block .day-mark { font-size: .65rem; color: var(--muted); }
@media (max-width: 480px) { .kidrow { grid-template-columns: 1fr; gap: 6px; } .block { min-width: 0; flex: 1 1 calc(50% - 6px); } }

/* event list */
.evlist { display: grid; gap: 2px; }
.ev { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 7px 6px; border-radius: 8px; text-align: left; border: 0; background: transparent; width: 100%; }
.ev:hover { background: var(--sunk); }
.ev .t { color: var(--muted); font-size: .85rem; padding-top: 1px; }
.ev .ttl { font-weight: 600; overflow-wrap: anywhere; }
.ev .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; font-size: .78rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c, var(--o8)) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c, var(--o8)) 40%, transparent); color: var(--fg); font-size: .76rem; font-weight: 600; }
.src { display: inline-flex; align-items: center; gap: 4px; }
.src i { width: 7px; height: 7px; border-radius: 2px; background: var(--c, var(--o6)); display: inline-block; }

/* gaps */
.gaplist { display: grid; gap: 6px; }
.gapitem { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: 1px dashed var(--gap); background: var(--gap-soft); text-align: left; width: 100%; }
.gapitem b { font-weight: 600; }
.allgood { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; }

/* week */
.weekbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.weekbar h2 { font-size: 1.3rem; margin-right: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; display: flex; flex-direction: column; }
.wday.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wday-h { padding: 8px 10px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; border-bottom: 1px solid var(--line); }
.wday-h .dn { font-weight: 700; font-family: var(--font-display); }
.wday-h .dd { color: var(--muted); font-size: .85rem; }
.wday-h .gapn { color: var(--gap); font-size: .75rem; font-weight: 700; }
.wcare { padding: 8px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.wkid { display: grid; gap: 3px; }
.wkid .kn { font-size: .72rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.strip { display: grid; gap: 3px; }
.seg { display: flex; justify-content: space-between; gap: 4px; border-radius: 5px; padding: 2px 6px; font-size: .74rem; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 18%, var(--surface)); text-align: left; width: 100%; }
.seg .sl { color: var(--muted); }
.seg .so { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg.gap { background: var(--gap-soft); border: 1px dashed var(--gap); }
.seg.gap .so { color: var(--gap); }
.seg.na { background: transparent; border: 1px dotted var(--line); }
.seg.na .so { color: var(--muted); font-weight: 400; }
.wev { padding: 6px; display: grid; gap: 2px; flex: 1; align-content: start; }
.wev .ev { grid-template-columns: 1fr; gap: 0; padding: 5px 6px; }
.wev .ev .t { font-size: .74rem; padding: 0; }
.wev .ev .ttl { font-size: .86rem; }
.wadd { margin: 4px 6px 8px; border: 1px dashed var(--line); background: transparent; border-radius: 6px; padding: 4px; color: var(--muted); font-size: .8rem; }
.wadd:hover { color: var(--fg); border-color: var(--muted); }
@media (max-width: 960px) {
  .week { grid-template-columns: 1fr; }
  .wday { display: grid; grid-template-columns: 1fr; }
  .strip { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}

/* lists */
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.addrow input[type="text"], .addrow input:not([type]) { flex: 1 1 200px; min-width: 0; }
input[type="text"], input[type="date"], input[type="time"], input:not([type]), select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; min-height: 64px; resize: vertical; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; }
.checklist li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); }
.checklist li:first-child { border-top: 0; }
.checklist li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.checklist li.done .grow { text-decoration: line-through; color: var(--muted); }
.checklist input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.xbtn { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; padding: 0 6px; }
.xbtn:hover { color: var(--gap); }
.group-h { margin-top: 12px; }
.due { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.due.late { color: var(--gap); font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }

/* setup */
.rowedit { display: flex; gap: 8px; align-items: center; padding: 6px 0; flex-wrap: wrap; }
.rowedit input { flex: 1 1 160px; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; background: var(--c); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--fg); }
.pattern-wrap { overflow-x: auto; }
table.pattern { border-collapse: collapse; width: 100%; min-width: 620px; }
table.pattern th, table.pattern td { padding: 4px; text-align: left; font-size: .85rem; }
table.pattern th { color: var(--muted); font-weight: 600; }
table.pattern select { width: 100%; padding: 5px 4px; font-size: .82rem; }
.toggles { display: flex; flex-wrap: wrap; gap: 14px; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; }
.callist { display: grid; gap: 6px; }
.callist label { display: flex; gap: 8px; align-items: center; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 26, .45); z-index: 20; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--surface); color: var(--fg); border-radius: 14px; width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
@media (max-width: 560px) {
  .scrim { place-items: end stretch; padding: 0; }
  .sheet { width: 100%; border-radius: 14px 14px 0 0; max-height: 88vh; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
}
.sheet h3 { font-size: 1.2rem; }
.field { display: grid; gap: 4px; }
.field > span { font-size: .8rem; color: var(--muted); font-weight: 600; }
.fieldrow { display: flex; gap: 10px; flex-wrap: wrap; }
.fieldrow > * { flex: 1 1 120px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 600; }
.opt:hover { background: var(--sunk); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-ctl button { border: 0; background: transparent; padding: 6px 12px; font-weight: 600; font-size: .85rem; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.daypick { display: flex; gap: 4px; flex-wrap: wrap; }
.daypick label { display: inline-flex; }
.daypick input { position: absolute; opacity: 0; pointer-events: none; }
.daypick span { display: inline-block; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: .82rem; font-weight: 600; }
.daypick input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.daypick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .left { margin-right: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.gnote { font-size: .82rem; color: var(--muted); }
.gerr { font-size: .85rem; padding: 8px 10px; border-radius: 8px; background: var(--sunk); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .16s ease-out; } @keyframes rise { from { transform: translateY(12px); opacity: .6; } } }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand"><h1>Family Planner</h1><span class="sync" id="sync"></span></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#today" data-v="today">Today</a>
      <a href="#week" data-v="week">Week</a>
      <a href="#groceries" data-v="groceries">Groceries</a>
      <a href="#tasks" data-v="tasks">Tasks</a>
      <a href="#family" data-v="family">Setup</a>
    </nav>
  </div>
</header>
<main id="main"><div class="panel"><p class="empty">Loading your family's plan…</p></div></main>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
(() => {
'use strict';
const GC = 'Google Calendar';
const COLORS = ['o1','o2','o3','o4','o5','o6','o7','o8'];
const BLOCKS = [
  { key: 'dropoff', label: 'Drop-off' },
  { key: 'pickup', label: 'Pickup' },
  { key: 'after', label: 'After school' },
  { key: 'evening', label: 'Evening' },
  { key: 'overnight', label: 'Overnight' },
];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DEFAULT_SETTINGS = {
  kids: [],
  people: [],
  blocks: ['dropoff','pickup','after'],
  stores: ['Grocery store','Costco'],
};

// ---------- state ----------
const S = {
  view: 'today',
  weekStart: null,
  db: null, user: null, mcp: null, perms: null,
  dbReady: false, dbMissing: false, canWrite: true,
  settings: null, patterns: {}, care: {}, events: [], groceries: [], tasks: [], gmeta: {},
  g: {},            // calendarId -> { events, err, at }
  gCals: null,      // list from list_calendars
  gState: 'idle',   // idle | off | ask | on | unavailable
  gErr: null,
  selCals: loadLocal('fp.cals', ['primary']),
};
const watches = new Map();

// ---------- helpers ----------
function loadLocal(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function saveLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const todayStr = () => ymd(new Date());
const dowOf = s => parseYmd(s).getDay();
const mondayOf = s => { const d = parseYmd(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); };
const shortDate = s => { const d = parseYmd(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const longDate = s => { const d = parseYmd(s); return `${DOW_LONG[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtTime = hm => { if (!hm) return ''; let [h,m] = hm.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const settings = () => S.settings || DEFAULT_SETTINGS;
const person = id => settings().people.find(p => p.id === id);
const kid = id => settings().kids.find(k => k.id === id);
const colorVar = c => `var(--${COLORS.includes(c) ? c : 'o8'})`;
const activeBlocks = () => BLOCKS.filter(b => settings().blocks.includes(b.key));

function toast(msg) {
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 2600);
}

// ---------- care logic ----------
function ownerOf(kidId, block, ds) {
  const day = S.care[ds];
  const o = day && day.v && day.v[kidId] ? day.v[kidId][block] : undefined;
  if (typeof o === 'string') return { v: o, src: 'day' };
  const p = S.patterns[kidId] && S.patterns[kidId][block] ? S.patterns[kidId][block][dowOf(ds)] : '';
  return { v: p || '', src: 'pattern' };
}
function ownerLabel(v) {
  if (v === 'na') return 'Not needed';
  if (!v) return 'Nobody yet';
  const p = person(v); return p ? p.name : 'Nobody yet';
}
function ownerColor(v) { const p = person(v); return p ? colorVar(p.color) : 'var(--o8)'; }
function gapsFrom(start, days) {
  const out = [];
  for (let i = 0; i < days; i++) {
    const ds = addDays(start, i);
    for (const k of settings().kids) for (const b of activeBlocks()) {
      const o = ownerOf(k.id, b.key, ds);
      if (!o.v || (o.v !== 'na' && !person(o.v))) out.push({ ds, kid: k, block: b });
    }
  }
  return out;
}

// ---------- events ----------
function plannerOn(ds) {
  const dw = dowOf(ds);
  return S.events.filter(e => {
    if (!e.date) return false;
    if (e.repeat && Array.isArray(e.repeat.days) && e.repeat.days.length) {
      if (ds < e.date) return false;
      if (e.repeat.until && ds > e.repeat.until) return false;
      if ((e.skip || []).includes(ds)) return false;
      return e.repeat.days.includes(dw);
    }
    return e.date === ds;
  }).map(e => ({ kind: 'p', e, allDay: !!e.allDay, start: e.allDay ? '' : (e.time || ''), title: e.title }));
}
function googleOn(ds) {
  const seen = new Set(); const out = [];
  const linked = new Set(S.events.filter(e => e.gcal && e.gcal.id).map(e => e.gcal.id));
  const linkedTitles = new Set(S.events.filter(e => e.gcal).map(e => (e.title || '').trim().toLowerCase() + '|' + e.date));
  for (const cal of S.selCals) {
    const g = S.g[cal]; if (!g || !g.events) continue;
    for (const ev of g.events) {
      if (!ev || ev.status === 'cancelled' || seen.has(ev.id)) continue;
      let on = false, allDay = false, start = '';
      if (ev.start && ev.start.date) {
        allDay = true; const end = (ev.end && ev.end.date) || addDays(ev.start.date, 1);
        on = ds >= ev.start.date && ds < end;
      } else if (ev.start && ev.start.dateTime) {
        const d = new Date(ev.start.dateTime); on = ymd(d) === ds; start = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      if (!on) continue;
      if (linked.has(ev.id) || linkedTitles.has((ev.summary || '').trim().toLowerCase() + '|' + ds)) continue;
      seen.add(ev.id);
      out.push({ kind: 'g', ev, cal, allDay, start, title: ev.summary || '(No title)' });
    }
  }
  return out;
}
function itemsOn(ds) {
  return [...plannerOn(ds), ...googleOn(ds)].sort((a, b) => (a.allDay === b.allDay ? (a.start || '').localeCompare(b.start || '') : a.allDay ? -1 : 1));
}
function calName(id) {
  if (id === 'primary') return 'My calendar';
  const c = (S.gCals || []).find(c => c.id === id); return c ? (c.summary || id) : id;
}
function calColor(id) { const i = Math.max(0, S.selCals.indexOf(id)); return colorVar(COLORS[(i + 5) % COLORS.length]); }

// ---------- rendering ----------
function evItem(it, compact) {

  for (const kId of kids) { const k = kid(kId); if (k) meta.push(`<span class="chip" style="--c:${colorVar(k.color)}">${esc(k.name)}</span>`); }
  if (owner && person(owner)) meta.push(`<span class="chip" style="--c:${ownerColor(owner)}">${esc(person(owner).name)} on it</span>`);
  if (it.kind === 'g') meta.push(`<span class="src" style="--c:${calColor(it.cal)}"><i></i>${esc(calName(it.cal))}</span>`);

}

function render() {

  const act = document.activeElement; const focusId = act && main.contains(act) ? act.id : null;
  let sel = null; try { if (focusId && act.selectionStart != null) sel = [act.selectionStart, act.selectionEnd]; } catch {}
  let top = '';

// ---------- Google Calendar ----------
function gErrorFor(err) {

  if (c === 'needs_reauth') return { msg: 'Google Calendar needs reconnecting. Reconnect it in claude.ai Settings → Connectors, then reload.', retract: true };
  if (c === 'server_not_connected') return { msg: "Google Calendar isn't connected to your claude.ai account. Add it in claude.ai Settings → Connectors, then reload.", retract: true };
  if (c === 'selection_required') return { msg: 'You have more than one Google Calendar connection. Choose one when claude.ai asks, then reload.', retract: true };
  if (c === 'not_in_manifest' || c === 'blocked_by_policy' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return { msg: 'Google Calendar is turned off for this page.', btn: '<button class="btn" data-act="gperm">Permissions</button>', retract: true };
  if (c === 'approval_required') return { msg: 'Google Calendar needs your OK to load events.', btn: '<button class="btn primary" data-act="gconnect">Allow</button>', retract: true };
  if (c === 'server_unavailable' || c === 'rate_limited') return { msg: "Google Calendar didn't answer. It'll try again in a few minutes.", retract: false };
  if (c === 'tool_error') return { msg: 'Google Calendar returned an error: ' + (err.message || 'unknown'), retract: false };
  return { msg: "Couldn't load Google Calendar: " + ((err && err.message) || 'unknown error'), retract: false };
}
function gRange() {
  const t = todayStr();
  const ws = S.weekStart;
  const start = ws < t ? ws : t;
  const a = addDays(ws, 7), b = addDays(t, 2);
  return { start, end: a > b ? a : b };
}
function syncWatches() {

  const { start, end } = gRange();
  const want = new Map();
  for (const cal of S.selCals) want.set(`${cal}|${start}|${end}`, { cal, input: { calendarId: cal, startTime: start + 'T00:00:00', endTime: end + 'T00:00:00', orderBy: 'startTime', pageSize: 250 } });
  for (const [k, u] of watches) if (!want.has(k)) { u(); watches.delete(k); }
  for (const [k, { cal, input }] of want) {
    if (watches.has(k)) continue;
    const unsub = S.mcp.watchTool(GC, 'list_events', input, ev => {
      if (!watches.has(k)) return;
      if (ev.type === 'data') {
        const p = ev.result && ev.result.payload;
        const events = p && Array.isArray(p.events) ? p.events : [];
        const prev = S.g[cal] && S.g[cal].events || [];
        // merge: keep events outside this range from earlier fetches
        const keep = prev.filter(x => { const sd = x.start && (x.start.date || (x.start.dateTime && ymd(new Date(x.start.dateTime)))); return sd && (sd < start || sd >= end); });
        S.g[cal] = { events: [...keep, ...events], at: (ev.result.cache && ev.result.cache.storedAt) || Date.now() };

function updateSync() {

  const m = Math.round((Date.now() - Math.min(...ats)) / 60000);
  el.textContent = m < 1 ? 'Google Calendar · just now' : `Google Calendar · ${m} min ago`;
}
setInterval(updateSync, 60000);
async function loadCalendars() {
  try {
    const r = await S.mcp.callTool(GC, 'list_calendars', {}, { cache: { staleTime: 5 * 60 * 1000 } });
    const p = r && r.payload; S.gCals = p && Array.isArray(p.calendars) ? p.calendars : [];

  const input = { summary: e.title, calendarId: cal };

    S.patterns = next; await savePatterns(next); schedule(); return;
  }
  if (a === 'rename') { const name = t.value.trim(); if (!name) return; const st = JSON.parse(JSON.stringify(settings())); const it = st[t.dataset.kind].find(x => x.id === t.dataset.id); if (!it || it.name === name) return; it.name = name; S.settings = st; await saveSettings(st); schedule(); return; }
  if (a === 'srename') { const name = t.value.trim(); if (!name) return; const st = JSON.parse(JSON.stringify(settings())); st.stores[Number(t.dataset.i)] = name; S.settings = st; await saveSettings(st); schedule(); return; }
  if (a === 'cal') {
    const sel = S.selCals.filter(c => c !== t.dataset.id);
    if (t.checked) sel.push(t.dataset.id);
    S.selCals = sel; saveLocal('fp.cals', sel); syncWatches(); schedule(); return;
  }
});
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'gform') {
    const name = f.querySelector('#g-name').value.trim(); if (!name) return;
    const store = f.querySelector('#g-store').value; f.querySelector('#g-name').value = '';
    await write(() => S.db.collection('groceries').doc(uid()).set({ name, store, done: false, createdAt: Date.now() }));
    f.querySelector('#g-name') && document.getElementById('g-name').focus();
    return;
  }
  if (f.id === 'tform') {
    const title = f.querySelector('#t-title').value.trim(); if (!title) return;
    const owner = f.querySelector('#t-owner').value, due = f.querySelector('#t-due').value;
    f.querySelector('#t-title').value = ''; f.querySelector('#t-due').value = '';
    await write(() => S.db.collection('tasks').doc(uid()).set({ title, owner, due, done: false, createdAt: Date.now() }), 'Task added');
    return;
  }
  if (f.dataset.add) {
    const kind = f.dataset.add; const inp = f.querySelector('input'); const name = inp.value.trim(); if (!name) return; inp.value = '';
    const st = JSON.parse(JSON.stringify(settings()));
    if (kind === 'stores') st.stores.push(name);
    else { const used = st[kind].map(x => x.color); st[kind].push({ id: uid(), name, color: COLORS.find(c => !used.includes(c)) || COLORS[st[kind].length % 8] }); }
    S.settings = st; schedule(); await saveSettings(st);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function route() {
  const h = (location.hash || '').slice(1);
  S.view = ['today','week','groceries','tasks','family'].includes(h) ? h : 'today';
  if (S.view === 'family' && S.mcp && S.gState === 'on' && !S.gCals) loadCalendars();
  schedule();
}
window.addEventListener('hashchange', route);

// ---------- boot ----------
S.weekStart = mondayOf(todayStr());
route();
// a new day while the page stays open
let lastDay = todayStr();
setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); S.weekStart = mondayOf(lastDay); syncWatches(); schedule(); } }, 60000);

(async () => {
  const c = window.claude;
  if (!c || !c.use) { S.dbMissing = true; S.settings = null; schedule(); S.gState = 'unavailable'; return; }
  const [db, user, mcp, perms] = await Promise.all([c.use('db'), c.use('user'), c.use('mcp'), c.use('permissions')]);
  S.db = db; S.user = user; S.mcp = mcp; S.perms = perms;
  if (user) { try { const w = await user.can('data.write'); if (w === false) S.canWrite = false; } catch {} }
  if (!db) { S.dbMissing = true; schedule(); }
  else {
    const err = e => { if (e && e.code === 'revoked') { S.dbMissing = true; schedule(); } };
    db.doc('family/settings').onSnapshot(s => { S.settings = s.exists ? { ...DEFAULT_SETTINGS, ...s.data() } : { ...DEFAULT_SETTINGS }; schedule(); }, err);
    db.doc('family/patterns').onSnapshot(s => { const d = s.exists ? s.data() : null; S.patterns = (d && d.p) || {}; schedule(); }, err);
    db.collection('care').where('date', '>=', addDays(todayStr(), -60)).onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.care = m; schedule(); }, err);
    db.collection('events').onSnapshot(s => { S.events = s.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, err);
    db.collection('groceries').onSnapshot(s => { S.groceries = s.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, err);
    db.collection('tasks').onSnapshot(s => { S.tasks = s.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, err);
    db.collection('gmeta').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.gmeta = m; schedule(); }, err);
  }
  if (!mcp) { S.gState = 'unavailable'; schedule(); return; }
  let st = 'prompt';
  if (perms) st = await perms.state('mcp:' + GC).catch(() => 'unavailable');
  if (st === 'granted') { S.gState = 'on'; schedule(); loadCalendars(); }
  else if (st === 'denied') { S.gState = 'on'; S.gErr = gErrorFor({ code: 'not_in_manifest' }); schedule(); }
  else { S.gState = 'ask'; schedule(); }
})();
})();
</script>
