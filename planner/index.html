<title>Family Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with tabs; one working column (max 1180px); week = 7 columns on desktop, stacked day cards on phones. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --sunk: #e8ecf0;
  --line: #d5dce3;
  --fg: #17212b;
  --muted: #5b6875;
  --accent: #1f6f78;
  --accent-ink: #ffffff;
  --accent-soft: #d8eced;
  --gap: #c4332b;
  --gap-soft: #fbe3e1;
  --ok: #2c7a4b;
  --na: #a3adb8;
  --o1: #1f8a8a; --o2: #d0683f; --o3: #7a5bc7; --o4: #c79a1e;
  --o5: #3f8f4f; --o6: #2f6fca; --o7: #c74a86; --o8: #607080;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 35, 50, .06), 0 4px 14px rgba(20, 35, 50, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171d; --surface: #19222a; --sunk: #222c35; --line: #2f3b46;
    --fg: #e6ecf1; --muted: #98a6b3; --accent: #5cc0c4; --accent-ink: #0d2427; --accent-soft: #1d3b3f;
    --gap: #ff7a70; --gap-soft: #3d1f1d; --ok: #6fcf94; --na: #5d6a76;
    --o1: #4cc2c0; --o2: #f08a5d; --o3: #a58bf0; --o4: #e6be48;
    --o5: #6cc27c; --o6: #6aa2f0; --o7: #ec7bb0; --o8: #95a5b5;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171d; --surface: #19222a; --sunk: #222c35; --line: #2f3b46;
  --fg: #e6ecf1; --muted: #98a6b3; --accent: #5cc0c4; --accent-ink: #0d2427; --accent-soft: #1d3b3f;
  --gap: #ff7a70; --gap-soft: #3d1f1d; --ok: #6fcf94; --na: #5d6a76;
  --o1: #4cc2c0; --o2: #f08a5d; --o3: #a58bf0; --o4: #e6be48;
  --o5: #6cc27c; --o6: #6aa2f0; --o7: #ec7bb0; --o8: #95a5b5;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.05rem; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 1.35rem; font-weight: 700; }
.brand .sync { font-size: .78rem; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 6px; scrollbar-width: none; }
nav.tabs a { padding: 9px 12px 10px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--gap); color: #fff; font-size: .72rem; text-align: center; line-height: 18px; }

main { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 18px; }
.banner { padding: 10px 14px; border-radius: var(--radius); background: var(--sunk); color: var(--fg); font-size: .9rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--gap-soft); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.empty { color: var(--muted); font-size: .9rem; padding: 6px 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: .9rem; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--gap); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; display: inline-grid; place-items: center; font-weight: 700; }

.today-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 820px) { .today-grid { grid-template-columns: 1fr; } }
.dayhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dayhead h2 { font-size: 1.6rem; }

/* care rows */
.kidrow { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.kidrow:first-of-type { border-top: 0; }
.kidname { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.kidname span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c, var(--o8)); }
.blocks { display: flex; flex-wrap: wrap; gap: 6px; }
.block { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 16%, var(--surface)); border-radius: 8px; padding: 4px 9px; min-width: 92px; text-align: left; }
.block .bl { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.block .bo { font-weight: 600; font-size: .9rem; }
.block.gap { --c: var(--gap); background: var(--gap-soft); border-style: dashed; border-color: var(--gap); }
.block.gap .bo { color: var(--gap); }
.block.na { --c: var(--na); background: transparent; border-style: dotted; }
.block.na .bo { color: var(--muted); font-weight: 500; }
.block .day-mark { font-size: .65rem; color: var(--muted); }
@media (max-width: 480px) { .kidrow { grid-template-columns: 1fr; gap: 6px; } .block { min-width: 0; flex: 1 1 calc(50% - 6px); } }

/* event list */
.evlist { display: grid; gap: 2px; }
.ev { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 7px 6px; border-radius: 8px; text-align: left; border: 0; background: transparent; width: 100%; }
.ev:hover { background: var(--sunk); }
.ev .t { color: var(--muted); font-size: .85rem; padding-top: 1px; }
.ev .ttl { font-weight: 600; overflow-wrap: anywhere; }
.ev .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; font-size: .78rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--c, var(--o8)) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c, var(--o8)) 40%, transparent); color: var(--fg); font-size: .76rem; font-weight: 600; }
.src { display: inline-flex; align-items: center; gap: 4px; }
.src i { width: 7px; height: 7px; border-radius: 2px; background: var(--c, var(--o6)); display: inline-block; }

/* gaps */
.gaplist { display: grid; gap: 6px; }
.gapitem { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: 1px dashed var(--gap); background: var(--gap-soft); text-align: left; width: 100%; }
.gapitem b { font-weight: 600; }
.allgood { display: flex; align-items: center; gap: 8px; color: var(--ok); font-weight: 600; }

/* week */
.weekbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.weekbar h2 { font-size: 1.3rem; margin-right: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wday { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; display: flex; flex-direction: column; }
.wday.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wday-h { padding: 8px 10px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; border-bottom: 1px solid var(--line); }
.wday-h .dn { font-weight: 700; font-family: var(--font-display); }
.wday-h .dd { color: var(--muted); font-size: .85rem; }
.wday-h .gapn { color: var(--gap); font-size: .75rem; font-weight: 700; }
.wcare { padding: 8px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.wkid { display: grid; gap: 3px; }
.wkid .kn { font-size: .72rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.strip { display: grid; gap: 3px; }
.seg { display: flex; justify-content: space-between; gap: 4px; border-radius: 5px; padding: 2px 6px; font-size: .74rem; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 18%, var(--surface)); text-align: left; width: 100%; }
.seg .sl { color: var(--muted); }
.seg .so { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg.gap { background: var(--gap-soft); border: 1px dashed var(--gap); }
.seg.gap .so { color: var(--gap); }
.seg.na { background: transparent; border: 1px dotted var(--line); }
.seg.na .so { color: var(--muted); font-weight: 400; }
.wev { padding: 6px; display: grid; gap: 2px; flex: 1; align-content: start; }
.wev .ev { grid-template-columns: 1fr; gap: 0; padding: 5px 6px; }
.wev .ev .t { font-size: .74rem; padding: 0; }
.wev .ev .ttl { font-size: .86rem; }
.wadd { margin: 4px 6px 8px; border: 1px dashed var(--line); background: transparent; border-radius: 6px; padding: 4px; color: var(--muted); font-size: .8rem; }
.wadd:hover { color: var(--fg); border-color: var(--muted); }
@media (max-width: 960px) {
  .week { grid-template-columns: 1fr; }
  .wday { display: grid; grid-template-columns: 1fr; }
  .strip { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}

/* lists */
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.addrow input[type="text"], .addrow input:not([type]) { flex: 1 1 200px; min-width: 0; }
input[type="text"], input[type="date"], input[type="time"], input:not([type]), select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; min-height: 64px; resize: vertical; }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; }
.checklist li { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); }
.checklist li:first-child { border-top: 0; }
.checklist li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.checklist li.done .grow { text-decoration: line-through; color: var(--muted); }
.checklist input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.xbtn { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; padding: 0 6px; }
.xbtn:hover { color: var(--gap); }
.group-h { margin-top: 12px; }
.due { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.due.late { color: var(--gap); font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }

/* setup */
.rowedit { display: flex; gap: 8px; align-items: center; padding: 6px 0; flex-wrap: wrap; }
.rowedit input { flex: 1 1 160px; }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; background: var(--c); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--fg); }
.pattern-wrap { overflow-x: auto; }
table.pattern { border-collapse: collapse; width: 100%; min-width: 620px; }
table.pattern th, table.pattern td { padding: 4px; text-align: left; font-size: .85rem; }
table.pattern th { color: var(--muted); font-weight: 600; }
table.pattern select { width: 100%; padding: 5px 4px; font-size: .82rem; }
.toggles { display: flex; flex-wrap: wrap; gap: 14px; }
.toggles label { display: inline-flex; gap: 6px; align-items: center; }
.callist { display: grid; gap: 6px; }
.callist label { display: flex; gap: 8px; align-items: center; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 26, .45); z-index: 20; display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--surface); color: var(--fg); border-radius: 14px; width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; }
@media (max-width: 560px) {
  .scrim { place-items: end stretch; padding: 0; }
  .sheet { width: 100%; border-radius: 14px 14px 0 0; max-height: 88vh; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
}
.sheet h3 { font-size: 1.2rem; }
.field { display: grid; gap: 4px; }
.field > span { font-size: .8rem; color: var(--muted); font-weight: 600; }
.fieldrow { display: flex; gap: 10px; flex-wrap: wrap; }
.fieldrow > * { flex: 1 1 120px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 600; }
.opt:hover { background: var(--sunk); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg-ctl button { border: 0; background: transparent; padding: 6px 12px; font-weight: 600; font-size: .85rem; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.daypick { display: flex; gap: 4px; flex-wrap: wrap; }
.daypick label { display: inline-flex; }
.daypick input { position: absolute; opacity: 0; pointer-events: none; }
.daypick span { display: inline-block; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; font-size: .82rem; font-weight: 600; }
.daypick input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.daypick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.actions .left { margin-right: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem; z-index: 30; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.gnote { font-size: .82rem; color: var(--muted); }
.gerr { font-size: .85rem; padding: 8px 10px; border-radius: 8px; background: var(--sunk); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.gapweek { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.gapweek:first-of-type { border-top: 0; padding-top: 0; }
.gapweek-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gapday { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: start; font-size: .9rem; }
.gapbtns { display: flex; flex-wrap: wrap; gap: 4px; }
.gapday .gapitem { width: auto; padding: 3px 9px; font-size: .82rem; }
fieldset.scope { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; margin: 0; display: grid; gap: 8px; }
fieldset.scope legend { font-size: .78rem; color: var(--muted); font-weight: 600; padding: 0 4px; }
fieldset.scope label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
fieldset.scope input { margin-top: 4px; accent-color: var(--accent); width: 18px; height: 18px; flex: none; }
.withmic { display: flex; gap: 6px; align-items: flex-start; flex: 1 1 200px; min-width: 0; }
.withmic > input, .withmic > textarea { flex: 1 1 auto; min-width: 0; width: 100%; }
.mic { flex: none; width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: inline-grid; place-items: center; padding: 0; }
.mic:hover { color: var(--fg); background: var(--sunk); }
.mic.on { background: var(--gap); border-color: var(--gap); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .mic.on { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--gap) 25%, transparent); } } }
.wx { padding: 4px 10px 0; font-size: .78rem; color: var(--muted); display: flex; gap: 4px; align-items: baseline; flex-wrap: wrap; }
.wx .tnum { color: var(--fg); font-weight: 600; }
.wx .wxrain { color: var(--o6); font-weight: 600; }
.wxnow { display: flex; gap: 14px; align-items: center; }
.wxbig { font-size: 2.6rem; line-height: 1; }
.wxtemp { font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; }
.wxtemp .muted { font-size: 1.1rem; font-weight: 500; }
.wxfacts { margin: 10px 0 0; display: grid; gap: 4px; font-size: .88rem; }
.wxfacts div { display: grid; grid-template-columns: 90px 1fr; gap: 8px; }
.wxfacts dt { color: var(--muted); }
.wxfacts dd { margin: 0; }
.wxtip { margin: 8px 0 0; font-size: .85rem; font-weight: 600; color: var(--o6); }
/* school day + meals */
.daytype { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 8px; }
.hint { font-size: .8rem; color: var(--gap); font-weight: 600; }
.wtype { padding: 6px 8px 0; }
.pill { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 1px 10px; font-size: .74rem; font-weight: 600; color: var(--muted); }
.pill.on { background: var(--accent-soft); border-color: transparent; color: var(--fg); }
.pill.warn { border-color: var(--gap); color: var(--gap); }
.wdinner { margin: 0 6px 4px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; padding: 6px 2px 2px; font-size: .82rem; font-weight: 600; }
.wdinner .sl, .mealcell .sl { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.linkish { border: 0; background: none; padding: 0; font-weight: 700; color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-align: left; }
.mealgrid { display: grid; gap: 6px; }
.mealday { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: start; padding: 6px 0; border-top: 1px solid var(--line); }
.mealday:first-child { border-top: 0; }
.mealday.is-today .md-h b { color: var(--accent); }
.md-h { display: grid; font-size: .9rem; padding-top: 6px; }
.md-h .busy { font-size: .72rem; color: var(--muted); overflow-wrap: anywhere; }
.md-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
.mealcell { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; text-align: left; min-width: 0; }
.mealcell .mn { font-weight: 600; overflow-wrap: anywhere; }
.mealcell.empty { border-style: dashed; background: transparent; }
.mealcell.empty .mn { color: var(--muted); font-weight: 500; }
.mealcell:hover { background: var(--sunk); }
@media (max-width: 480px) { .mealday { grid-template-columns: 1fr; gap: 4px; } .md-h { padding-top: 0; } }
.kidhead { display: flex; align-items: center; gap: 8px; font-size: 1rem; margin: 14px 0 4px; }

<script>
(() => {
'use strict';
const GC = 'Google Calendar';
const COLORS = ['o1','o2','o3','o4','o5','o6','o7','o8'];
// type: school = only on school days, off = only on no-school days, all = every day
const BLOCKS = [
  { key: 'dropoff', label: 'Drop-off', type: 'school' },
  { key: 'pickup', label: 'Pickup', type: 'school' },
  { key: 'after', label: 'After school', type: 'school' },
  { key: 'daytime', label: 'Daytime', type: 'off' },
  { key: 'evening', label: 'Evening', type: 'all' },
  { key: 'overnight', label: 'Overnight', type: 'all' },
];
const MEAL_SLOTS = [
  { key: 'breakfast', label: 'Breakfast' },
  { key: 'lunch', label: 'Lunch' },
  { key: 'lunchbox', label: 'Lunchbox' },
  { key: 'dinner', label: 'Dinner' },
];
const NO_SCHOOL_RE = /\b(no[\s-]+school|school (is )?closed|school holiday|no classes|teacher (work|in-?service) day)\b/i;
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOW_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DEFAULT_SETTINGS = {
  kids: [],
  people: [],
  careBlocks: ['dropoff','pickup','daytime','evening'],
  schoolDays: [1,2,3,4,5],
  stores: ['Grocery store','Costco'],
  mealSlots: ['dinner'],
};

// ---------- state ----------
const S = {
  view: 'today',
  weekStart: null,
  db: null, user: null, mcp: null, perms: null,
  dbReady: false, dbMissing: false, canWrite: true,
  settings: null, patterns: {}, care: {}, events: [], groceries: [], tasks: [], gmeta: {}, meals: {},
  dict: null, wx: {}, wxState: 'idle', wxErr: null, wxAt: 0, wxSearch: null, rules: {}, nsEvents: {}, careReady: false, mealWeek: null, sample: undefined, downloads: null, plan: null, restore: null,
  g: {},            // calendarId -> { events, err, at }
  gCals: null,      // list from list_calendars
  gState: 'idle',   // idle | off | ask | on | unavailable
  gErr: null,
  selCals: loadLocal('fp.cals', ['primary']),
};
const watches = new Map();

// ---------- helpers ----------
function loadLocal(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function saveLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const todayStr = () => ymd(new Date());
const dowOf = s => parseYmd(s).getDay();
const mondayOf = s => { const d = parseYmd(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return ymd(d); };
const shortDate = s => { const d = parseYmd(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const longDate = s => { const d = parseYmd(s); return `${DOW_LONG[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtTime = hm => { if (!hm) return ''; let [h,m] = hm.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
// Older saves used `blocks` (school-day blocks only); read them as careBlocks plus Daytime.
function settings() {
  const s = S.settings || {};
  return {
    kids: s.kids || [], people: s.people || [],
    stores: s.stores || DEFAULT_SETTINGS.stores,
    careBlocks: s.careBlocks || (s.blocks ? [...s.blocks, 'daytime'] : DEFAULT_SETTINGS.careBlocks),
    schoolDays: s.schoolDays || DEFAULT_SETTINGS.schoolDays,
    mealSlots: s.mealSlots || DEFAULT_SETTINGS.mealSlots,
    weather: s.weather && s.weather.key ? s.weather : null,
  };
}
const person = id => settings().people.find(p => p.id === id);
const kid = id => settings().kids.find(k => k.id === id);
const colorVar = c => `var(--${COLORS.includes(c) ? c : 'o8'})`;
const blockDef = key => BLOCKS.find(b => b.key === key);

function toast(msg) {
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ''; }, 2600);
}

// ---------- care logic ----------
function ownerOf(kidId, block, ds) {
  const day = S.care[ds];
  const o = day && day.v && day.v[kidId] ? day.v[kidId][block] : undefined;
  if (typeof o === 'string') return { v: o, src: 'day' };
  return { v: patternVal(kidId, block, ds), src: 'pattern' };
}
// Weekly choices are dated: one made on Dec 2 applies to Dec 2 and later only.
// S.rules[kid][block][weekday] = [{from, v}]; older undated choices live in S.patterns.
function patternVal(kidId, block, ds) {
  const dw = dowOf(ds);
  const list = S.rules[kidId] && S.rules[kidId][block] && S.rules[kidId][block][dw];
  if (Array.isArray(list)) { let best = null; for (const r of list) if (r.from <= ds && (!best || r.from > best.from)) best = r; if (best) return best.v || ''; }
  const p = S.patterns[kidId] && S.patterns[kidId][block]; return (p && p[dw]) || '';
}
// Set a weekly choice from `from` onward (later dated choices for that weekday are replaced).
function setWeekly(kidId, block, from, v) {
  const dw = dowOf(from);
  const next = JSON.parse(JSON.stringify(S.rules || {}));
  next[kidId] = next[kidId] || {}; next[kidId][block] = next[kidId][block] || {};
  const list = (next[kidId][block][dw] || []).filter(r => r.from < from);
  // keep earlier days as they were when nothing dated covers them yet
  if (!list.length) { const old = S.patterns[kidId] && S.patterns[kidId][block] && S.patterns[kidId][block][dw]; if (old) list.push({ from: '0000-00-00', v: old }); }
  list.push({ from, v }); next[kidId][block][dw] = list;
  S.rules = next; schedule();
  return write(() => S.db.doc('family/patterns').set({ p: S.patterns, r: next }));
}
// ---------- weather (AccuWeather connector) ----------
const AW = 'AccuWeather®'; // must match the connector's name in claude.ai exactly
// AccuWeather icon numbers -> a small symbol
function wxIcon(n) {
  n = Number(n);
  if ([1, 2, 30].includes(n)) return '☀️';
  if ([3, 4, 5].includes(n)) return '🌤️';
  if ([6, 7, 8, 38].includes(n)) return '☁️';
  if (n === 11) return '🌫️';
  if ([12, 13, 14, 39, 40].includes(n)) return '🌦️';
  if ([15, 16, 17, 41, 42].includes(n)) return '⛈️';
  if (n === 18) return '🌧️';
  if ([19, 20, 21, 22, 23, 24, 25, 26, 29, 43, 44].includes(n)) return '🌨️';
  if (n === 31) return '🥶';
  if (n === 32) return '💨';
  if ([33, 34].includes(n)) return '🌙';
  if ([35, 36, 37].includes(n)) return '☁️';
  return '🌡️';
}
const wxDay = ds => S.wx[ds] || null;
const rainPct = w => Math.max(Number(w.day && w.day.rainProbabilityValue) || 0, Number(w.night && w.night.rainProbabilityValue) || 0);
let wxUnsub = null, wxKey = '';
function startWeather() {
  if (!S.mcp) return;
  if (!settings().weather) return;
  const key = settings().weather.key;
  if (wxUnsub && wxKey === key) return;
  if (wxUnsub) wxUnsub();
  wxKey = key; S.wx = {};
  wxUnsub = S.mcp.watchTool(AW, 'widgets-daily-claude', { queryParams: { locationKey: key } }, ev => {
    if (ev.type === 'data') {
      const p = ev.result && ev.result.payload; const m = {};
      for (const d of (p && Array.isArray(p.dailyForecast) ? p.dailyForecast : [])) if (d && typeof d.date === 'string') m[d.date.slice(0, 10)] = d;
      S.wx = m; S.wxAt = (ev.result.cache && ev.result.cache.storedAt) || Date.now(); S.wxState = 'on'; S.wxErr = null;
    } else {
      const c = ev.error && ev.error.code;
      if (['needs_reauth', 'server_not_connected', 'selection_required', 'not_in_manifest', 'blocked_by_policy', 'not_granted', 'capability_disabled', 'approval_required'].includes(c)) S.wx = {};
      S.wxErr = c === 'server_not_connected' ? "AccuWeather isn't connected. Add it in claude.ai Settings → Connectors."
        : c === 'needs_reauth' ? 'AccuWeather needs reconnecting in claude.ai Settings → Connectors.'
        : (c === 'not_in_manifest' || c === 'not_granted') ? 'Weather is turned off for this page.'
        : c === 'approval_required' ? 'AccuWeather needs your OK.'
        : c === 'server_unavailable' ? "AccuWeather didn't answer. It'll try again soon."
        : "Couldn't load the weather.";
      if (c === 'not_in_manifest' || c === 'not_granted' || c === 'approval_required') { S.wxState = 'ask'; if (wxUnsub) wxUnsub(); wxUnsub = null; }
    }
    schedule();
  }, { refetchInterval: 3 * 3600 * 1000, cache: { staleTime: 30 * 60 * 1000, gcTime: 12 * 3600 * 1000 } });
}
async function connectWeather() {
  if (!S.mcp) return;
  if (!settings().weather) { location.hash = '#family'; toast('Choose your town under Setup → Weather first.'); return; }
  try {
    await S.mcp.callTool(AW, 'widgets-daily-claude', { queryParams: { locationKey: settings().weather.key } }, { cache: { staleTime: 30 * 60 * 1000 } });
    S.wxState = 'on'; S.wxErr = null; startWeather();
  } catch (e) {
    const c = e && e.code;
    S.wxErr = c === 'server_not_connected' ? "AccuWeather isn't connected. Add it in claude.ai Settings → Connectors, then reload." : c === 'not_in_manifest' ? 'Weather was not allowed for this page.' : "Couldn't load the weather. Try again in a moment.";
    S.wxState = 'ask';
  }
  schedule();
}
function wxLine(ds) {
  const w = wxDay(ds); if (!w || !w.day) return '';
  const r = rainPct(w);
  return `<div class="wx" title="${esc(w.day.longPhrase || w.day.phrase || '')}"><span aria-hidden="true">${wxIcon(w.day.icon)}</span> <span class="tnum">${esc(w.day.temperature)}°/${esc(w.night ? w.night.temperature : '')}°</span>${r >= 30 ? ` <span class="wxrain tnum">${r}% rain</span>` : ''}</div>`;
}
function weatherPanel(ds) {
  const place = settings().weather ? settings().weather.name : '';
  let body;
  if (S.mcp && !settings().weather) body = '<p class="empty">Choose your town under <a href="#family">Setup → Weather</a> to see the forecast.</p>';
  else if (S.mcp === null) body = '<p class="gnote">Weather isn\'t available in this view.</p>';
  else if (S.wxState === 'ask') body = `<div class="gerr"><span>${esc(S.wxErr || `Show the forecast${place ? ` for ${place}` : ''} from AccuWeather.`)}</span><button class="btn primary" data-act="wxconnect">Show weather</button></div>`;
  else if (!wxDay(ds)) body = S.wxErr ? `<div class="gerr">${esc(S.wxErr)}</div>` : '<p class="empty">Loading the forecast…</p>';
  else {
    const w = wxDay(ds), r = rainPct(w);
    body = `<div class="wxnow"><span class="wxbig" aria-hidden="true">${wxIcon(w.day.icon)}</span>
      <div><div class="wxtemp tnum">${esc(w.day.temperature)}° <span class="muted">/ ${esc(w.night.temperature)}°</span></div><div>${esc(w.day.phrase || w.day.iconPhrase || '')}</div></div></div>
      <dl class="wxfacts">
        <div><dt>Rain</dt><dd class="tnum">${esc(w.day.rainProbabilityValue)}% day · ${esc(w.night.rainProbabilityValue)}% night</dd></div>
        <div><dt>Feels like</dt><dd class="tnum">${esc(w.day.realFeel || '')}</dd></div>
        ${w.day.extended && w.day.extended.wind ? `<div><dt>Wind</dt><dd>${esc(w.day.extended.wind)}</dd></div>` : ''}
        <div><dt>Tonight</dt><dd>${esc(w.night.phrase || '')}</dd></div>
      </dl>
      ${r >= 40 ? '<p class="wxtip">Pack rain jackets.</p>' : ''}`;
  }
  return `<section class="panel" aria-labelledby="h-wx"><div class="panel-head"><h2 id="h-wx">Weather</h2><span class="small muted">${esc(place)}</span></div>${body}
    ${S.wxAt && wxDay(ds) ? `<p class="gnote" style="margin:8px 0 0">AccuWeather · updated ${esc(new Date(S.wxAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }))}</p>` : ''}</section>`;
}
async function searchPlace(q) {
  if (!S.mcp || !q) return;
  S.wxSearch = { q, status: 'loading', results: [] }; schedule();
  try {
    const r = await S.mcp.callTool(AW, 'widgets-search-claude', { queryParams: { query: q } }, { cache: { staleTime: 5 * 60 * 1000 } });
    const res = r && r.payload && Array.isArray(r.payload.results) ? r.payload.results.filter(x => x && x.locationKey && x.name) : [];
    S.wxSearch = { q, status: 'done', results: res.slice(0, 8) };
  } catch (e) { S.wxSearch = { q, status: 'error', results: [] }; }
  schedule();
}

// ---------- voice input ----------
const MIC_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h2.5a1 1 0 1 1 0 2h-7a1 1 0 1 1 0-2H11v-1.56a8 8 0 0 1-7-7.94 1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>';
let micTarget = null, micOn = false;
function micBtn(id) {
  if (!S.dict) return '';
  const on = micOn && micTarget === id;
  return `<button type="button" class="mic${on ? ' on' : ''}" data-act="mic" data-target="${id}" aria-pressed="${on}" aria-label="${on ? 'Stop voice input' : 'Speak instead of typing'}" title="${on ? 'Stop' : 'Speak'}">${MIC_SVG}</button>`;
}
function paintMics() {
  document.querySelectorAll('.mic').forEach(b => { const on = micOn && b.dataset.target === micTarget; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Stop voice input' : 'Speak instead of typing'); });
}
// Must run straight from the click: start() needs the viewer's gesture.
function toggleMic(btn) {
  const d = S.dict; if (!d) return;
  const id = btn.dataset.target;
  if (d.active()) { d.stop().catch(() => {}); if (micTarget === id) return; }
  micTarget = id;
  const el = document.getElementById(id); if (el) el.focus();
  d.start().catch(e => {
    const c = e && e.code;
    if (c === 'not_granted') toast('Voice input is turned off for this page. Turn it on from the Permissions menu.');
    else if (c === 'unavailable') { S.dict = null; schedule(); toast("Voice input isn't available here. Use your keyboard's microphone key instead."); }
    else if (c === 'rate_limited') toast('Voice input is busy. Try again in a moment.');
    else if (c !== 'stopped' && c !== 'dismissed') toast("Voice input didn't start. Try again.");
  });
}
function wireDictation(d) {
  d.onFinal(({ text }) => {
    const el = micTarget && document.getElementById(micTarget); if (!el || !text) return;
    el.value = (el.value + text).replace(/^\s+/, '');
    el.dispatchEvent(new Event('input', { bubbles: true }));
  });
  d.onState(({ state, reason }) => {
    micOn = state !== 'idle'; paintMics();
    if (state === 'idle' && reason === 'unavailable') { S.dict = null; schedule(); }
  });
}
const nextOnOrAfter = (start, dw) => addDays(start, (dw - dowOf(start) + 7) % 7);
function ownerLabel(v) {
  if (v === 'na') return 'Not needed';
  if (!v) return 'Nobody yet';
  const p = person(v); return p ? p.name : 'Nobody yet';
}
function ownerColor(v) { const p = person(v); return p ? colorVar(p.color) : 'var(--o8)'; }
// A day is a school day if marked so; otherwise it follows the usual school weekdays.
function dayMark(ds) { const d = S.care[ds]; return d && typeof d.school === 'boolean' ? d.school : null; }
function isSchool(ds) { const m = dayMark(ds); return m !== null ? m : settings().schoolDays.includes(dowOf(ds)); }
function blocksFor(k, ds) {
  const school = k.school !== false && isSchool(ds);
  const on = settings().careBlocks;
  return BLOCKS.filter(b => on.includes(b.key) && (b.type === 'all' || b.type === (school ? 'school' : 'off')));
}
// Google all-day events like "No school!" on a day still counted as a school day.
function calNoSchool(ds) {
  if (!isSchool(ds) || dayMark(ds) !== null) return null;
  const hit = googleOn(ds).find(i => NO_SCHOOL_RE.test(i.title));
  return hit ? hit.title : null;
}
// Gaps from today (or the week's start, if later) to the end of that Monday–Sunday week.
function weekGaps(ws) { const t = todayStr(); const from = ws > t ? ws : t; const end = addDays(ws, 7); if (from >= end) return []; return gapsFrom(from, Math.round((parseYmd(end) - parseYmd(from)) / 864e5)); }
function gapsFrom(start, days) {
  const out = [];
  for (let i = 0; i < days; i++) {
    const ds = addDays(start, i);
    for (const k of settings().kids) for (const b of blocksFor(k, ds)) {
      const o = ownerOf(k.id, b.key, ds);
      if (!o.v || (o.v !== 'na' && !person(o.v))) out.push({ ds, kid: k, block: b });
    }
  }
  return out;
}

// ---------- events ----------
function plannerOn(ds) {
  const dw = dowOf(ds);
  return S.events.filter(e => {
    if (!e.date) return false;
    if (e.repeat && Array.isArray(e.repeat.days) && e.repeat.days.length) {
      if (ds < e.date) return false;
      if (e.repeat.until && ds > e.repeat.until) return false;
      if ((e.skip || []).includes(ds)) return false;
      return e.repeat.days.includes(dw);
    }
    return e.date === ds;
  }).map(e => ({ kind: 'p', e, allDay: !!e.allDay, start: e.allDay ? '' : (e.time || ''), title: e.title }));
}
function googleOn(ds) {
  const seen = new Set(); const out = [];
  const linked = new Set(S.events.filter(e => e.gcal && e.gcal.id).map(e => e.gcal.id));
  const linkedTitles = new Set(S.events.filter(e => e.gcal).map(e => (e.title || '').trim().toLowerCase() + '|' + e.date));
  for (const cal of S.selCals) {
    const g = S.g[cal]; if (!g || !g.events) continue;
    for (const ev of g.events) {
      if (!ev || ev.status === 'cancelled' || seen.has(ev.id)) continue;
      let on = false, allDay = false, start = '';
      if (ev.start && ev.start.date) {
        allDay = true; const end = (ev.end && ev.end.date) || addDays(ev.start.date, 1);
        on = ds >= ev.start.date && ds < end;
      } else if (ev.start && ev.start.dateTime) {
        const d = new Date(ev.start.dateTime); on = ymd(d) === ds; start = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      if (!on) continue;
      if (linked.has(ev.id) || linkedTitles.has((ev.summary || '').trim().toLowerCase() + '|' + ds)) continue;
      seen.add(ev.id);
      out.push({ kind: 'g', ev, cal, allDay, start, title: ev.summary || '(No title)' });
    }
  }
  return out;
}
function itemsOn(ds) {
  return [...plannerOn(ds), ...googleOn(ds)].sort((a, b) => (a.allDay === b.allDay ? (a.start || '').localeCompare(b.start || '') : a.allDay ? -1 : 1));
}
function calName(id) {
  if (id === 'primary') return 'My calendar';
  const c = (S.gCals || []).find(c => c.id === id); return c ? (c.summary || id) : id;
}
function calColor(id) { const i = Math.max(0, S.selCals.indexOf(id)); return colorVar(COLORS[(i + 5) % COLORS.length]); }

// ---------- rendering ----------
function evItem(it, compact) {
  const meta = [];
  let owner = '', kids = [];
  if (it.kind === 'p') { owner = it.e.owner; kids = it.e.kids || []; }
  else { const m = S.gmeta[it.ev.id]; if (m) { owner = m.owner; kids = m.kids || []; } }
  for (const kId of kids) { const k = kid(kId); if (k) meta.push(`<span class="chip" style="--c:${colorVar(k.color)}">${esc(k.name)}</span>`); }
  if (owner && person(owner)) meta.push(`<span class="chip" style="--c:${ownerColor(owner)}">${esc(person(owner).name)} on it</span>`);
  if (it.kind === 'g') meta.push(`<span class="src" style="--c:${calColor(it.cal)}"><i></i>${esc(calName(it.cal))}</span>`);
  else if (it.e.repeat && it.e.repeat.days && it.e.repeat.days.length) meta.push('<span>Repeats</span>');
  const t = it.allDay ? 'All day' : fmtTime(it.start);
  const data = it.kind === 'p' ? `data-act="ev" data-id="${esc(it.e.id)}"` : `data-act="gev" data-id="${esc(it.ev.id)}" data-cal="${esc(it.cal)}"`;
  return `<button class="ev" ${data} data-ds="${esc(it.ds || '')}"><span class="t tnum">${esc(t)}</span><span><span class="ttl">${esc(it.title)}</span>${meta.length ? `<span class="meta">${meta.join('')}</span>` : ''}</span></button>`;
}
function careRows(ds) {
  const kids = settings().kids;
  if (!kids.length) return `<p class="empty">Add your kids in <a href="#family">Setup</a> to track who has them.</p>`;
  const school = isSchool(ds), hint = calNoSchool(ds);
  const typeRow = `<div class="daytype"><div class="seg-ctl" role="group" aria-label="School day or not">
      <button type="button" data-act="daytype" data-ds="${ds}" data-v="1" aria-pressed="${school}">School day</button>
      <button type="button" data-act="daytype" data-ds="${ds}" data-v="0" aria-pressed="${!school}">No school</button></div>
      ${hint ? `<span class="hint">Your calendar says “${esc(hint)}”</span>` : S.care[ds] && S.care[ds].schoolNote && !school ? `<span class="small muted">From your calendar: ${esc(S.care[ds].schoolNote)}</span>` : ''}</div>`;
  return typeRow + kids.map(k => `<div class="kidrow"><div class="kidname"><span class="dot" style="--c:${colorVar(k.color)}"></span><span>${esc(k.name)}</span></div><div class="blocks">${
    blocksFor(k, ds).map(b => { const o = ownerOf(k.id, b.key, ds); const gap = !o.v || (o.v !== 'na' && !person(o.v));
      const cls = gap ? 'gap' : o.v === 'na' ? 'na' : '';
      return `<button class="block ${cls}" style="--c:${ownerColor(o.v)}" data-act="care" data-kid="${esc(k.id)}" data-block="${b.key}" data-ds="${ds}"><span class="bl">${esc(b.label)}${o.src === 'day' ? ' · changed' : ''}</span><span class="bo">${esc(ownerLabel(gap ? '' : o.v))}</span></button>`; }).join('')
  }</div></div>`).join('');
}
function gBlock() {
  if (S.gState === 'unavailable') return `<p class="gnote">Google Calendar isn't available in this view. Open the planner on claude.ai to see it.</p>`;
  if (S.gState === 'off' || S.gState === 'ask') return `<div class="gerr"><span>See your Google Calendar events here too.</span><button class="btn primary" data-act="gconnect">Connect Google Calendar</button></div>`;
  if (S.gErr) return `<div class="gerr"><span>${esc(S.gErr.msg)}</span>${S.gErr.btn || ''}</div>`;
  return '';
}
// One banner for every day in a range that the calendar says has no school.
function noSchoolBanner(start, days) {
  const hits = [...Array(days)].map((_, i) => addDays(start, i)).filter(ds => calNoSchool(ds));
  if (!hits.length) return '';
  const span = hits.length === 1 ? longDate(hits[0]) : `${shortDate(hits[0])} – ${shortDate(hits[hits.length - 1])}`;
  return `<div class="banner"><span>Your calendar says “${esc(calNoSchool(hits[0]))}” on ${esc(span)}.</span><button class="btn primary" data-act="marknoschool" data-days="${hits.join(',')}">Mark ${hits.length === 1 ? 'it' : `all ${hits.length} days`} as no school</button></div>`;
}

function renderToday() {
  const t = todayStr(), tm = addDays(t, 1);
  const thisWk = mondayOf(t);
  const items = itemsOn(t).map(i => ({ ...i, ds: t }));
  const tItems = itemsOn(tm).map(i => ({ ...i, ds: tm }));
  const dueTasks = S.tasks.filter(x => !x.done && x.due && x.due <= tm).sort((a, b) => a.due.localeCompare(b.due));
  const openG = S.groceries.filter(g => !g.done).length;
  const hasPattern = Object.keys(S.patterns || {}).length > 0 || Object.keys(S.rules || {}).length > 0;
  return `
  <div class="dayhead"><h2>${esc(longDate(t))}</h2><span class="muted">Here's what's happening today.</span></div>
  ${gBlock()}
  ${noSchoolBanner(t, 14)}
  <div class="today-grid">
    <div class="stack">
      <section class="panel" aria-labelledby="h-care">
        <div class="panel-head"><h2 id="h-care">Who has the kids today</h2><span class="small muted">Tap a block to change it</span></div>
        ${careRows(t)}
      </section>
      <section class="panel" aria-labelledby="h-cal">
        <div class="panel-head"><h2 id="h-cal">Today's calendar</h2><button class="btn" data-act="newev" data-ds="${t}">Add event</button></div>
        <div class="evlist">${items.length ? items.map(i => evItem(i)).join('') : '<p class="empty">Nothing on the calendar today.</p>'}</div>
      </section>
      <section class="panel" aria-labelledby="h-tom">
        <div class="panel-head"><h2 id="h-tom">Tomorrow · ${esc(longDate(tm))}</h2></div>
        ${settings().kids.length ? careRows(tm) : ''}
        <div class="evlist" style="margin-top:8px">${tItems.length ? tItems.map(i => evItem(i)).join('') : '<p class="empty">Nothing on the calendar tomorrow.</p>'}</div>
      </section>
    </div>
    <div class="stack">
      ${weatherPanel(t)}
      <section class="panel" aria-labelledby="h-gaps">
        <div class="panel-head"><h2 id="h-gaps">Care gaps</h2></div>
        ${!settings().kids.length ? '<p class="empty">No kids added yet.</p>' : [[thisWk, 'This week'], [addDays(thisWk, 7), 'Next week']].map(([ws, label]) => {
          const g = weekGaps(ws);
          const byDay = {}; g.forEach(x => { (byDay[x.ds] = byDay[x.ds] || []).push(x); });
          return `<div class="gapweek"><div class="gapweek-h"><h3 class="eyebrow">${label} · ${esc(shortDate(ws))}–${esc(shortDate(addDays(ws, 6)))}</h3>${g.length ? `<span class="chip" style="--c:var(--gap)">${g.length} open</span>` : '<span class="allgood small">All covered</span>'}</div>
          ${g.length ? `<div class="gaplist">${Object.entries(byDay).map(([ds, xs]) => `<div class="gapday"><b>${esc(DOW[dowOf(ds)])} ${esc(shortDate(ds))}</b><span class="gapbtns">${xs.map(x => `<button class="gapitem" data-act="care" data-kid="${esc(x.kid.id)}" data-block="${x.block.key}" data-ds="${ds}">${settings().kids.length > 1 ? `${esc(x.kid.name)} · ` : ''}${esc(x.block.label)}</button>`).join('')}</span></div>`).join('')}</div>` : ''}</div>`;
        }).join('')}
        ${!hasPattern && settings().kids.length ? `<p class="small muted" style="margin:8px 0 0">Set who usually covers each day in <a href="#family">Setup</a> and most gaps fill in on their own.</p>` : ''}
      </section>
      <section class="panel" aria-labelledby="h-tasks">
        <div class="panel-head"><h2 id="h-tasks">Due today and tomorrow</h2><a href="#tasks" class="small">All tasks</a></div>
        ${dueTasks.length ? `<ul class="checklist">${dueTasks.map(taskLi).join('')}</ul>` : '<p class="empty">Nothing due.</p>'}
      </section>
      <section class="panel" aria-labelledby="h-groc">
        <div class="panel-head"><h2 id="h-groc">Food</h2><a href="#groceries" class="small">Meals &amp; groceries</a></div>
        ${settings().mealSlots.includes('dinner') ? `<p style="margin:0 0 6px"><span class="eyebrow">Dinner tonight</span><br>${mealAt(t, 'dinner') ? `<button class="linkish" data-act="meal" data-ds="${t}" data-slot="dinner">${esc(mealAt(t, 'dinner').name)}</button>` : '<span class="muted">Not planned yet</span>'}</p>` : ''}
        <p class="empty" style="padding:0">${openG ? `${openG} item${openG === 1 ? '' : 's'} on the grocery list.` : 'The grocery list is empty.'}</p>
      </section>
    </div>
  </div>`;
}

function renderWeek() {
  const ws = S.weekStart, we = addDays(ws, 6), t = todayStr();
  const people = settings().people;
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  const gapCount = weekGaps(ws).length;
  return `
  <div class="weekbar">
    <h2>${esc(shortDate(ws))} – ${esc(shortDate(we))}</h2>
    ${gapCount ? `<span class="chip" style="--c:var(--gap)">${gapCount} care gap${gapCount === 1 ? '' : 's'}</span>` : ''}
    <button class="iconbtn" data-act="wk" data-d="-7" aria-label="Previous week">‹</button>
    <button class="btn" data-act="wk" data-d="0">This week</button>
    <button class="iconbtn" data-act="wk" data-d="7" aria-label="Next week">›</button>
  </div>
  ${gBlock()}
  ${noSchoolBanner(ws, 7)}
  ${people.length ? `<div class="legend">${people.map(p => `<span class="chip" style="--c:${colorVar(p.color)}">${esc(p.name)}</span>`).join('')}<span class="chip" style="--c:var(--gap)">Nobody yet</span></div>` : ''}
  <div class="week">${days.map(ds => {
    const its = itemsOn(ds).map(i => ({ ...i, ds }));
    const gn = ds >= t ? gapsFrom(ds, 1).length : 0;
    const school = isSchool(ds), hint = calNoSchool(ds);
    const dinner = settings().mealSlots.includes('dinner') ? mealAt(ds, 'dinner') : null;
    return `<section class="wday${ds === t ? ' is-today' : ''}" aria-label="${esc(longDate(ds))}">
      <div class="wday-h"><span><span class="dn">${DOW[dowOf(ds)]}</span> <span class="dd">${esc(shortDate(ds))}</span></span>${gn ? `<span class="gapn">${gn} gap${gn === 1 ? '' : 's'}</span>` : ''}</div>
      ${wxLine(ds)}
      ${settings().kids.length ? `<div class="wtype"><button class="pill${school ? ' on' : ''}${hint ? ' warn' : ''}" data-act="daytype" data-ds="${ds}" data-v="${school ? 0 : 1}" aria-label="${school ? 'School day' : 'No school'}. Tap to switch.">${school ? 'School day' : 'No school'}${hint ? ' ?' : ''}</button></div>` : ''}
      ${settings().kids.length ? `<div class="wcare">${settings().kids.map(k => `<div class="wkid">${settings().kids.length > 1 ? `<span class="kn"><span class="dot" style="--c:${colorVar(k.color)}"></span>${esc(k.name)}</span>` : ''}<div class="strip">${
        blocksFor(k, ds).map(b => { const o = ownerOf(k.id, b.key, ds); const gap = !o.v || (o.v !== 'na' && !person(o.v));
          return `<button class="seg ${gap ? 'gap' : o.v === 'na' ? 'na' : ''}" style="--c:${ownerColor(o.v)}" data-act="care" data-kid="${esc(k.id)}" data-block="${b.key}" data-ds="${ds}" aria-label="${esc(b.label)}: ${esc(ownerLabel(gap ? '' : o.v))}"><span class="sl">${esc(b.label)}</span><span class="so">${esc(gap ? 'Nobody' : o.v === 'na' ? '—' : ownerLabel(o.v))}</span></button>`; }).join('')
      }</div></div>`).join('')}</div>` : ''}
      <div class="wev">${its.map(i => evItem(i, true)).join('')}</div>
      ${dinner ? `<button class="wdinner" data-act="meal" data-ds="${ds}" data-slot="dinner"><span class="sl">Dinner</span> ${esc(dinner.name)}</button>` : ''}
      <button class="wadd" data-act="newev" data-ds="${ds}">+ Add</button>
    </section>`;
  }).join('')}</div>`;
}

function taskLi(x) {
  const p = person(x.owner); const late = x.due && x.due < todayStr() && !x.done;
  return `<li class="${x.done ? 'done' : ''}"><input type="checkbox" id="tk-${esc(x.id)}" data-act="tdone" data-id="${esc(x.id)}" ${x.done ? 'checked' : ''} aria-label="Done: ${esc(x.title)}">
    <span class="grow">${esc(x.title)}${p ? ` <span class="chip" style="--c:${colorVar(p.color)}">${esc(p.name)}</span>` : ''}</span>
    ${x.due ? `<span class="due tnum${late ? ' late' : ''}">${late ? 'Overdue · ' : ''}${esc(x.due === todayStr() ? 'Today' : shortDate(x.due))}</span>` : ''}
    <button class="xbtn" data-act="tdel" data-id="${esc(x.id)}" aria-label="Delete ${esc(x.title)}">×</button></li>`;
}
function renderTasks() {
  const open = S.tasks.filter(x => !x.done).sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.createdAt || 0) - (b.createdAt || 0));
  const done = S.tasks.filter(x => x.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 15);
  const people = settings().people;
  return `<section class="panel" aria-labelledby="h-t">
    <div class="panel-head"><h2 id="h-t">Family to-dos</h2><span class="small muted">${open.length} open</span></div>
    <form class="addrow" id="tform">
      <span class="withmic"><input type="text" id="t-title" placeholder="Sign permission slip, book dentist…" aria-label="New task" required>${micBtn('t-title')}</span>
      <select id="t-owner" aria-label="Who's doing it"><option value="">Anyone</option>${people.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>
      <input type="date" id="t-due" aria-label="Due date">
      <button class="btn primary" type="submit">Add task</button>
    </form>
    ${open.length ? `<ul class="checklist" style="margin-top:10px">${open.map(taskLi).join('')}</ul>` : '<p class="empty" style="margin-top:10px">No open tasks. Add the first one above.</p>'}
    ${done.length ? `<h3 class="eyebrow group-h">Recently done</h3><ul class="checklist">${done.map(taskLi).join('')}</ul>` : ''}
  </section>`;
}

function mealAt(ds, slot) { const d = S.meals[ds]; return d && d.slots && d.slots[slot] && d.slots[slot].name ? d.slots[slot] : null; }
const normItem = s => String(s || '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();

function renderPlanBox() {
  const P = S.plan || { status: 'idle' };
  if (S.sample === null) return `<p class="gnote">Meal ideas from Claude aren't available in this view. Open the planner on claude.ai to use them.</p>`;
  if (P.status === 'off') return `<p class="gnote">${esc(P.err)}</p>`;
  const form = `<form id="mpform" class="opts" style="gap:8px">
      <label class="field"><span>What kind of week?</span><span class="withmic"><textarea id="mp-ask" placeholder="Quick weeknight dinners, one vegetarian night, kid-friendly, use the slow cooker on Wednesday, tacos on Tuesday…">${esc(P.ask || '')}</textarea>${micBtn('mp-ask')}</span></label>
      <div class="toggles small"><label><input type="checkbox" id="mp-empty" ${P.onlyEmpty === false ? '' : 'checked'}> Only fill days that aren't planned</label></div>
      <div class="actions"><button class="btn primary" type="submit" ${P.status === 'loading' ? 'disabled' : ''}>${P.status === 'loading' ? 'Thinking…' : 'Suggest meals'}</button></div>
    </form>`;
  if (P.status === 'loading') return form + `<p class="gnote" aria-live="polite">Claude is planning ${esc(P.slotsCount || '')} meal${P.slotsCount === 1 ? '' : 's'}${P.streamed ? ' · writing…' : '…'}</p>`;
  if (P.status === 'error') return form + `<div class="gerr" role="alert">${esc(P.err)}</div>`;
  if (P.status === 'ready') return form + `
    <div class="proposal">
      <h3 class="eyebrow group-h">Suggestions</h3>
      <ul class="checklist">${P.meals.map((m, i) => `<li><input type="checkbox" id="mp-pick-${i}" data-act="mppick" data-i="${i}" ${P.picked[i] ? 'checked' : ''} aria-label="Use ${esc(m.name)}">
        <span class="grow"><span class="small muted">${esc(DOW[dowOf(m.date)])} ${esc(shortDate(m.date))} · ${esc((MEAL_SLOTS.find(s => s.key === m.slot) || {}).label || m.slot)}</span><br><b>${esc(m.name)}</b>${m.note ? `<br><span class="small muted">${esc(m.note)}</span>` : ''}
        <br><span class="small muted">${esc(m.ingredients.map(x => x.item).join(', '))}</span></span></li>`).join('')}</ul>
      <div class="toggles small" style="margin-top:8px"><label><input type="checkbox" id="mp-tolist" checked> Add their ingredients to the grocery list</label></div>
      <div class="actions" style="margin-top:8px"><button class="btn left" data-act="mpdiscard">Discard</button><button class="btn primary" data-act="mpuse">Use ${P.picked.filter(Boolean).length} meal${P.picked.filter(Boolean).length === 1 ? '' : 's'}</button></div>
    </div>`;
  return form;
}

function renderGroceries() {
  const st = settings();
  const stores = st.stores.length ? st.stores : ['Grocery store'];
  const items = S.groceries;
  const groups = {};
  for (const s of stores) groups[s] = [];
  for (const it of items) { const s = stores.includes(it.store) ? it.store : stores[0]; groups[s].push(it); }
  const anyDone = items.some(i => i.done);
  const ws = S.mealWeek, days = [...Array(7)].map((_, i) => addDays(ws, i)), t = todayStr();
  const slots = MEAL_SLOTS.filter(s => st.mealSlots.includes(s.key));
  const planned = days.reduce((n, ds) => n + slots.filter(s => mealAt(ds, s.key)).length, 0);
  return `<div class="two">
  <div class="stack">
    <section class="panel" aria-labelledby="h-m">
      <div class="panel-head"><h2 id="h-m">Meal plan · ${esc(shortDate(ws))} – ${esc(shortDate(addDays(ws, 6)))}</h2>
        <span class="weekbar"><button class="iconbtn" data-act="mwk" data-d="-7" aria-label="Previous week">‹</button><button class="btn" data-act="mwk" data-d="0">This week</button><button class="iconbtn" data-act="mwk" data-d="7" aria-label="Next week">›</button></span></div>
      <div class="mealgrid">${days.map(ds => `<div class="mealday${ds === t ? ' is-today' : ''}"><div class="md-h"><b>${DOW[dowOf(ds)]}</b> <span class="muted">${esc(shortDate(ds))}</span>${busyNote(ds) ? `<span class="busy">${esc(busyNote(ds))}</span>` : ''}</div>
        <div class="md-slots">${slots.map(s => { const m = mealAt(ds, s.key);
          return `<button class="mealcell${m ? '' : ' empty'}" data-act="meal" data-ds="${ds}" data-slot="${s.key}">${slots.length > 1 ? `<span class="sl">${esc(s.label)}</span>` : ''}<span class="mn">${m ? esc(m.name) : '+ Add'}</span></button>`; }).join('')}</div></div>`).join('')}</div>
      ${planned ? `<div class="actions" style="margin-top:10px"><button class="btn" data-act="mtolist">Add this week's ingredients to the list</button></div>` : ''}
    </section>
    <section class="panel" aria-labelledby="h-mp">
      <div class="panel-head"><h2 id="h-mp">Plan meals with Claude</h2></div>
      ${renderPlanBox()}
    </section>
  </div>
  <section class="panel" aria-labelledby="h-g">
    <div class="panel-head"><h2 id="h-g">Grocery list</h2>${anyDone ? '<button class="btn" data-act="gclear">Clear checked</button>' : ''}</div>
    <form class="addrow" id="gform">
      <span class="withmic"><input type="text" id="g-name" placeholder="Milk, eggs, birthday candles…" aria-label="Item" required>${micBtn('g-name')}</span>
      <select id="g-store" aria-label="Store">${stores.map(s => `<option>${esc(s)}</option>`).join('')}</select>
      <button class="btn primary" type="submit">Add</button>
    </form>
    ${!items.length ? '<p class="empty" style="margin-top:10px">The list is empty. Anything either of you adds shows up on both phones.</p>' :
      Object.entries(groups).filter(([, l]) => l.length).map(([s, l]) => `<h3 class="eyebrow group-h">${esc(s)}</h3><ul class="checklist">${
        l.sort((a, b) => (a.done - b.done) || (a.createdAt || 0) - (b.createdAt || 0)).map(i => `<li class="${i.done ? 'done' : ''}"><input type="checkbox" id="gi-${esc(i.id)}" data-act="gdone" data-id="${esc(i.id)}" ${i.done ? 'checked' : ''} aria-label="Got ${esc(i.name)}"><span class="grow">${esc(i.name)}${i.qty ? ` <span class="small muted">${esc(i.qty)}</span>` : ''}${i.meal ? `<br><span class="small muted">for ${esc(i.meal)}</span>` : ''}</span><button class="xbtn" data-act="gdel" data-id="${esc(i.id)}" aria-label="Remove ${esc(i.name)}">×</button></li>`).join('')
      }</ul>`).join('')}
  </section>
  </div>`;
}
// Evening events (3pm or later) hint that dinner should be quick.
function busyNote(ds) {
  const late = itemsOn(ds).filter(i => !i.allDay && i.start >= '15:00');
  return late.length ? `${late[0].title} ${fmtTime(late[0].start)}` : '';
}

function swatches(kind, id, cur) {
  return `<span class="swatches" role="group" aria-label="Color">${COLORS.map(c => `<button class="sw" style="--c:var(--${c})" data-act="color" data-kind="${kind}" data-id="${esc(id)}" data-c="${c}" aria-pressed="${c === cur}" aria-label="Color ${c.slice(1)}"></button>`).join('')}</span>`;
}
function renderFamily() {
  const st = settings();
  const ppl = st.people;
  const ownerOpts = (val) => `<option value="" ${!val ? 'selected' : ''}>—</option><option value="na" ${val === 'na' ? 'selected' : ''}>Not needed</option>${ppl.map(p => `<option value="${esc(p.id)}" ${val === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}`;
  const order = [1,2,3,4,5,6,0];
  return `
  <div class="two">
    <section class="panel" aria-labelledby="h-kids">
      <div class="panel-head"><h2 id="h-kids">Kids</h2></div>
      ${st.kids.map(k => `<div class="rowedit"><input type="text" id="kn-${esc(k.id)}" value="${esc(k.name)}" data-act="rename" data-kind="kids" data-id="${esc(k.id)}" aria-label="Name">${swatches('kids', k.id, k.color)}<label class="small"><input type="checkbox" id="ks-${esc(k.id)}" data-act="kidschool" data-id="${esc(k.id)}" ${k.school !== false ? 'checked' : ''}> In school</label><button class="xbtn" data-act="rm" data-kind="kids" data-id="${esc(k.id)}" aria-label="Remove ${esc(k.name)}">×</button></div>`).join('') || '<p class="empty">No kids yet.</p>'}
      <form class="addrow" data-add="kids" style="margin-top:8px"><input type="text" id="add-kids" placeholder="Child's name" aria-label="Child's name" required><button class="btn" type="submit">Add child</button></form>
    </section>
    <section class="panel" aria-labelledby="h-ppl">
      <div class="panel-head"><h2 id="h-ppl">Who can cover care</h2></div>
      <p class="small muted" style="margin:0 0 6px">Parents, grandparents, sitters, school or camp.</p>
      ${ppl.map(p => `<div class="rowedit"><input type="text" id="pn-${esc(p.id)}" value="${esc(p.name)}" data-act="rename" data-kind="people" data-id="${esc(p.id)}" aria-label="Name">${swatches('people', p.id, p.color)}<button class="xbtn" data-act="rm" data-kind="people" data-id="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">×</button></div>`).join('') || '<p class="empty">Nobody yet.</p>'}
      <form class="addrow" data-add="people" style="margin-top:8px"><input type="text" id="add-people" placeholder="Name or role" aria-label="Name or role" required><button class="btn" type="submit">Add</button></form>
    </section>
  </div>
  <section class="panel" aria-labelledby="h-blocks">
    <div class="panel-head"><h2 id="h-blocks">School days and care blocks</h2></div>
    <div class="field"><span>Usual school days</span><div class="daypick">${order.map(d => `<label><input type="checkbox" id="sd-${d}" data-act="schoolday" data-d="${d}" ${st.schoolDays.includes(d) ? 'checked' : ''}><span>${DOW[d]}</span></label>`).join('')}</div></div>

function render() {
  const main = document.getElementById('main');
  // keep what's being typed and where focus is
  const keep = {}; main.querySelectorAll('input[id],select[id],textarea[id]').forEach(el => { if (el.type !== 'checkbox') keep[el.id] = el.value; });
  const act = document.activeElement; const focusId = act && main.contains(act) ? act.id : null;
  let sel = null; try { if (focusId && act.selectionStart != null) sel = [act.selectionStart, act.selectionEnd]; } catch {}
  let top = '';
  if (S.dbMissing) top = `<div class="banner warn">Sign in to claude.ai to see and edit the family's plan. Nothing you change here is saved.</div>`;
  else if (!S.canWrite) top = `<div class="banner">You can view this planner but not change it. Ask the owner for edit access.</div>`;
  const v = S.view;
  const body = v === 'week' ? renderWeek() : v === 'tasks' ? renderTasks() : v === 'groceries' ? renderGroceries() : v === 'family' ? renderFamily() : renderToday();
  main.innerHTML = top + body;
  for (const [id, val] of Object.entries(keep)) { const el = document.getElementById(id); if (el && el.tagName !== 'SELECT' && document.activeElement !== el && el.dataset.act !== 'rename' && el.dataset.act !== 'srename') { if (!el.value) el.value = val; } }
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.value = keep[focusId] ?? el.value; el.focus(); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
  document.querySelectorAll('#tabs a').forEach(a => { a.toggleAttribute('aria-current', a.dataset.v === v); if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); });
  const gapsN = S.settings ? weekGaps(mondayOf(todayStr())).length : 0;
  const wk = document.querySelector('#tabs a[data-v="week"]'); wk.innerHTML = `Week${gapsN ? `<span class="badge" aria-label="${gapsN} care gaps">${gapsN}</span>` : ''}`;
}
let rq = 0; function schedule() { cancelAnimationFrame(rq); rq = requestAnimationFrame(render); }

function guard() {

async function write(fn, okMsg) {

    if (c === 'invalid_argument') { S.canWrite = false; schedule(); toast("That change wasn't saved: you may not have edit access."); }

    else if (c === 'resource_exhausted') toast('Too many changes at once. Wait a moment and try again.');

}

// Days your Google Calendar marks as no school are switched automatically,
// unless someone already chose school day / no school for that date.
const nsWatches = new Map();
function syncNoSchoolWatches() {
  if (!S.mcp || S.gState !== 'on') { for (const u of nsWatches.values()) u(); nsWatches.clear(); return; }
  const start = todayStr(), end = addDays(start, 400);
  const want = new Set(S.selCals.map(c => c + '|' + start));
  for (const [k, u] of nsWatches) if (!want.has(k)) { u(); nsWatches.delete(k); }
  for (const cal of S.selCals) {
    const k = cal + '|' + start; if (nsWatches.has(k)) continue;
    nsWatches.set(k, S.mcp.watchTool(GC, 'list_events', { calendarId: cal, startTime: start + 'T00:00:00', endTime: end + 'T00:00:00', fullText: 'school', orderBy: 'startTime', pageSize: 250 }, ev => {
      if (ev.type !== 'data') return;
      const p = ev.result && ev.result.payload;
      S.nsEvents[cal] = p && Array.isArray(p.events) ? p.events : [];
      applyNoSchool();
    }, { refetchInterval: 6 * 3600 * 1000, cache: { staleTime: 10 * 60 * 1000 } }));
  }
}
function noSchoolDays() {
  const out = new Map(); const t = todayStr();
  for (const evs of Object.values(S.nsEvents)) for (const ev of evs) {
    if (!ev || ev.status === 'cancelled' || !NO_SCHOOL_RE.test(ev.summary || '')) continue;
    if (ev.start && ev.start.date) { const endD = (ev.end && ev.end.date) || addDays(ev.start.date, 1); for (let d = ev.start.date; d < endD; d = addDays(d, 1)) if (d >= t) out.set(d, ev.summary); }
    else if (ev.start && ev.start.dateTime) { const d = ymd(new Date(ev.start.dateTime)); if (d >= t) out.set(d, ev.summary); }
  }
  return out;
}
let nsBusy = false;
async function applyNoSchool() {
  if (nsBusy || !S.careReady || !S.db || !S.canWrite) return;
  nsBusy = true;
  try {
    const todo = [...noSchoolDays()].filter(([ds]) => dayMark(ds) === null && settings().schoolDays.includes(dowOf(ds))).sort();
    let n = 0;
    for (const [ds, title] of todo) {
      const cur = S.care[ds] ? JSON.parse(JSON.stringify(S.care[ds])) : { date: ds, v: {} };
      cur.date = ds; cur.v = cur.v || {}; cur.school = false; cur.schoolNote = String(title).slice(0, 120);
      S.care[ds] = cur;
      try { await S.db.doc('care/' + ds).set(cur); n++; } catch { break; }
    }
    if (n) { schedule(); toast(`Marked ${n} no-school day${n === 1 ? '' : 's'} from your calendar`); }
  } finally { nsBusy = false; }
}
function setDayType(ds, school) {

// Adds ingredients not already on the open list; returns how many were added.
async function addIngredients(list) {

  const open = new Set(S.groceries.filter(g => !g.done).map(g => normItem(g.name)));
  const stores = settings().stores;
  let n = 0;
  for (const x of list) {
    const key = normItem(x.item); if (!key || open.has(key)) continue;
    open.add(key);
    const store = stores.includes(x.store) ? x.store : (stores[0] || '');
    const ok = await write(() => S.db.collection('groceries').doc(uid()).set({ name: String(x.item).trim(), qty: x.qty || '', store, meal: x.meal || '', done: false, createdAt: Date.now() }));
    if (!ok) break; n++;

  return n;
}
function weekIngredients(ws) {
  const out = []; const slots = settings().mealSlots;
  for (let i = 0; i < 7; i++) for (const s of slots) { const m = mealAt(addDays(ws, i), s); if (m) for (const x of (m.ingredients || [])) out.push({ ...x, meal: m.name }); }
  return out;
}
// "2 lb chicken thighs" lines <-> {item, qty}
function parseIngLines(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^((?:\d[\d./\s-]*|a |an |one |two |three |half )(?:\s*(?:lb|lbs|oz|g|kg|cups?|tbsp|tsp|cans?|jars?|bags?|boxes?|packs?|packages?|bunch(?:es)?|heads?|cloves?|dozen|pints?|quarts?|gallons?|bottles?|loaf|loaves|ml|l)\b\.?)?)\s+(.+)$/i);

  });
}

let planCtl = null;
async function planMeals(ask, onlyEmpty) {
  const st = settings(), ws = S.mealWeek;
  const slots = MEAL_SLOTS.filter(s => st.mealSlots.includes(s.key));
  const want = [];
  for (let i = 0; i < 7; i++) { const ds = addDays(ws, i); for (const s of slots) if (!onlyEmpty || !mealAt(ds, s.key)) want.push({ date: ds, weekday: DOW_LONG[dowOf(ds)], slot: s.key }); }
  if (!want.length) { S.plan = { status: 'error', ask, onlyEmpty, err: 'Every meal this week is already planned. Untick "Only fill days that aren\'t planned" to replace them.' }; schedule(); return; }
  const context = [...Array(7)].map((_, i) => {
    const ds = addDays(ws, i);
    const evening = itemsOn(ds).filter(x => !x.allDay && x.start >= '15:00').map(x => `${x.title} at ${fmtTime(x.start)}`);
    const planned = slots.map(s => mealAt(ds, s.key) ? `${s.label}: ${mealAt(ds, s.key).name}` : '').filter(Boolean);
    return `- ${DOW_LONG[dowOf(ds)]} ${ds}: ${isSchool(ds) ? 'school day' : 'no school'}${evening.length ? `; evening plans: ${evening.join(', ')}` : ''}${planned.length ? `; already planned: ${planned.join(', ')}` : ''}`;
  }).join('\n');
  const prompt = `You are helping a family with young kids plan meals for the week of ${longDate(ws)}.

What they asked for:
"""${ask || 'Simple, family-friendly meals.'}"""

The week:
${context}

Plan exactly these meals (one per line, date and slot):
${want.map(w => `${w.date} ${w.weekday} ${w.slot}`).join('\n')}

Guidance: keep evenings with plans quick (30 minutes or less, or slow cooker or leftovers). Vary the meals across the week. Reuse ingredients across meals where it makes sense. "lunchbox" means a packed school lunch for a kid.

Stores they shop at: ${st.stores.join(', ') || 'a grocery store'}. Put each ingredient's best store, or "" if any store.

Reply with only JSON in this shape:
{"meals":[{"date":"YYYY-MM-DD","slot":"dinner","name":"Sheet-pan chicken fajitas","note":"20 minutes; good for the busy Tuesday","ingredients":[{"item":"chicken thighs","qty":"1.5 lb","store":""}]}]}
List only ingredients to buy: skip salt, pepper, oil, water and common spices.`;
  if (planCtl) planCtl.abort();
  planCtl = new AbortController();
  S.plan = { status: 'loading', ask, onlyEmpty, slotsCount: want.length };
  schedule();
  try {
    const res = await S.sample.json(prompt, { signal: planCtl.signal, onText: () => { if (S.plan && !S.plan.streamed) { S.plan.streamed = true; schedule(); } } });
    const valid = new Set(want.map(w => w.date + '|' + w.slot));
    const meals = (res && Array.isArray(res.meals) ? res.meals : []).filter(m => m && valid.has(m.date + '|' + m.slot) && m.name)
      .map(m => ({ date: m.date, slot: m.slot, name: String(m.name), note: String(m.note || ''), ingredients: (Array.isArray(m.ingredients) ? m.ingredients : []).filter(x => x && x.item).map(x => ({ item: String(x.item), qty: String(x.qty || ''), store: String(x.store || '') })) }))
      .sort((a, b) => (a.date + a.slot).localeCompare(b.date + b.slot));
    if (!meals.length) { S.plan = { status: 'error', ask, onlyEmpty, err: "Claude's answer didn't include any meals for this week. Try again, or describe what you want a little differently." }; }
    else S.plan = { status: 'ready', ask, onlyEmpty, meals, picked: meals.map(() => true) };
  } catch (e) {
    const c = e && e.code;
    if (c === 'cancelled') return;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) S.plan = { status: 'off', err: 'Meal ideas from Claude are turned off for this page. You can still plan meals by tapping a day.' };
    else if (c === 'rate_limited') S.plan = { status: 'error', ask, onlyEmpty, err: "You've hit your Claude usage limit for now. Try again a bit later." };
    else if (c === 'session_expired') S.plan = { status: 'error', ask, onlyEmpty, err: 'Your claude.ai sign-in expired. Reload the page and sign in again.' };
    else if (c === 'invalid_json') S.plan = { status: 'error', ask, onlyEmpty, err: "Claude's answer came back in the wrong format. Press Suggest meals to try again." };
    else if (c === 'refused') S.plan = { status: 'error', ask, onlyEmpty, err: "Claude wouldn't plan meals from that request. Try rewording it." };

}

  let n = 0;
  if (toList) n = await addIngredients(chosen.flatMap(m => m.ingredients.map(x => ({ ...x, meal: m.name }))));
  S.plan = { status: 'idle', ask: P.ask, onlyEmpty: P.onlyEmpty };
  schedule();
  toast(`Added ${chosen.length} meal${chosen.length === 1 ? '' : 's'}${toList ? ` and ${n} grocery item${n === 1 ? '' : 's'}` : ''}`);
}

// ---------- backups ----------
const BACKUP_COLLECTIONS = ['care', 'events', 'groceries', 'tasks', 'gmeta', 'meals'];
async function collectBackup() {
  const out = { app: 'family-planner', version: 2, exportedAt: new Date().toISOString(), family: {} };
  for (const id of ['settings', 'patterns']) { const s = await S.db.doc('family/' + id).get(); if (s.exists) out.family[id] = s.data(); }
  for (const c of BACKUP_COLLECTIONS) { const q = await S.db.collection(c).limit(1000).get(); out[c] = {}; q.docs.forEach(d => { out[c][d.id] = d.data(); }); }
  return out;
}
const backupName = () => { const d = new Date(); return `Family Planner backup ${todayStr()} ${pad(d.getHours())}${pad(d.getMinutes())}.json`; };
function backupStatus() {
  const last = loadLocal('fp.lastDrive', null);
  return last ? `Last Google Drive backup from this device: ${last}.` : 'No Google Drive backup from this device yet.';
}
async function backupToDrive(auto) {
  if (!S.db || !S.mcp) return false;
  try {
    const data = await collectBackup();
    await S.mcp.callTool('Google Drive', 'create_file', { title: backupName(), textContent: JSON.stringify(data), contentMimeType: 'application/json', disableConversionToGoogleType: true });
    const d = new Date(); saveLocal('fp.lastDrive', `${longDate(todayStr())} at ${fmtTime(`${pad(d.getHours())}:${pad(d.getMinutes())}`)}`); saveLocal('fp.lastDriveDay', todayStr());
    schedule(); if (!auto) toast('Backed up to Google Drive'); return true;
  } catch (e) {
    const c = e && e.code;
    const msg = c === 'needs_reauth' ? 'Google Drive needs reconnecting in claude.ai Settings → Connectors.'
      : c === 'server_not_connected' ? "Google Drive isn't connected. Add it in claude.ai Settings → Connectors."
      : (c === 'not_in_manifest' || c === 'not_granted' || c === 'blocked_by_policy') ? 'Google Drive is turned off for this page. Turn it on from the Permissions menu.'
      : c === 'server_unavailable' ? "Google Drive didn't answer. Check Drive before trying again, in case the backup went through."
      : "Couldn't back up to Google Drive: " + ((e && e.message) || 'unknown error');
    if (!auto) toast(msg); else console.warn('Auto backup skipped:', msg);
    return false;
  }
}
async function maybeAutoBackup(now) {
  if (!loadLocal('fp.autoDrive', false) || !S.db || !S.mcp) return;
  if (loadLocal('fp.lastDriveDay', '') === todayStr() && !now) return;
  if (!now) { const st = S.perms ? await S.perms.state('mcp:Google Drive').catch(() => 'unavailable') : 'prompt'; if (st !== 'granted') return; }
  backupToDrive(!now);
}
async function downloadBackup() {
  if (!S.db || !S.downloads) return;
  try {
    const data = await collectBackup();
    await S.downloads.save({ filename: backupName().replace(/ /g, '-').toLowerCase(), data: JSON.stringify(data, null, 1) });
    toast('Backup saved');
  } catch (e) { if (e && e.code !== 'declined') toast("Couldn't save the backup file here. Try Back up to Google Drive instead."); }
}
async function readRestoreFile(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'family-planner' || !data.family) throw new Error('not a planner backup');
    S.restore = { data, when: data.exportedAt ? new Date(data.exportedAt).toLocaleString() : file.name };
  } catch { S.restore = null; toast("That file isn't a Family Planner backup."); }
  schedule();
}
async function doRestore() {
  const data = S.restore && S.restore.data; S.restore = null; schedule();
  if (!data || !guard()) return;
  toast('Restoring…');
  try {
    for (const id of ['settings', 'patterns']) if (data.family[id]) await S.db.doc('family/' + id).set(data.family[id]);
    for (const c of BACKUP_COLLECTIONS) {
      const keep = data[c] || {};
      const now = await S.db.collection(c).limit(1000).get();
      for (const d of now.docs) if (!keep[d.id]) await S.db.doc(c + '/' + d.id).delete();
      for (const [id, body] of Object.entries(keep)) await S.db.doc(c + '/' + id).set(body);
    }
    toast('Backup restored');
  } catch { toast('The restore stopped partway. Try it again from the same file.'); }
}
