// ---------- Google Calendar ----------
function gErrorFor(err) {
  const c = err && err.code;
  if (c === 'needs_reauth') return { msg: 'Google Calendar needs reconnecting. Reconnect it in claude.ai Settings → Connectors, then reload.', retract: true };
  if (c === 'server_not_connected') return { msg: "Google Calendar isn't connected to your claude.ai account. Add it in claude.ai Settings → Connectors, then reload.", retract: true };
  if (c === 'selection_required') return { msg: 'You have more than one Google Calendar connection. Choose one when claude.ai asks, then reload.', retract: true };
  if (c === 'not_in_manifest' || c === 'blocked_by_policy' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return { msg: 'Google Calendar is turned off for this page.', btn: '<button class="btn" data-act="gperm">Permissions</button>', retract: true };
  if (c === 'approval_required') return { msg: 'Google Calendar needs your OK to load events.', btn: '<button class="btn primary" data-act="gconnect">Allow</button>', retract: true };
  if (c === 'server_unavailable' || c === 'rate_limited') return { msg: "Google Calendar didn't answer. It'll try again in a few minutes.", retract: false };
  if (c === 'tool_error') return { msg: 'Google Calendar returned an error: ' + (err.message || 'unknown'), retract: false };
  return { msg: "Couldn't load Google Calendar: " + ((err && err.message) || 'unknown error'), retract: false };
}
function gRange() {
  const t = todayStr();
  const ws = S.weekStart;
  const start = ws < t ? ws : t;
  const a = addDays(ws, 7), b = addDays(t, 2);
  return { start, end: a > b ? a : b };
}
function syncWatches() {
  if (!S.mcp || S.gState !== 'on') { for (const u of watches.values()) u(); watches.clear(); return; }
  const { start, end } = gRange();
  const want = new Map();
  for (const cal of S.selCals) want.set(`${cal}|${start}|${end}`, { cal, input: { calendarId: cal, startTime: start + 'T00:00:00', endTime: end + 'T00:00:00', orderBy: 'startTime', pageSize: 250 } });
  for (const [k, u] of watches) if (!want.has(k)) { u(); watches.delete(k); }
  for (const [k, { cal, input }] of want) {
    if (watches.has(k)) continue;
    const unsub = S.mcp.watchTool(GC, 'list_events', input, ev => {
      if (!watches.has(k)) return;
      if (ev.type === 'data') {
        const p = ev.result && ev.result.payload;
        const events = p && Array.isArray(p.events) ? p.events : [];
        const prev = S.g[cal] && S.g[cal].events || [];
        // merge: keep events outside this range from earlier fetches
        const keep = prev.filter(x => { const sd = x.start && (x.start.date || (x.start.dateTime && ymd(new Date(x.start.dateTime)))); return sd && (sd < start || sd >= end); });
        S.g[cal] = { events: [...keep, ...events], at: (ev.result.cache && ev.result.cache.storedAt) || Date.now() };
        S.gErr = null; updateSync(); schedule();
      } else {
        const info = gErrorFor(ev.error);
        if (info.retract) S.g = {};
        S.gErr = info; schedule();
      }
    }, { refetchInterval: 5 * 60 * 1000, cache: { staleTime: 60 * 1000 } });
    watches.set(k, unsub);
  }
}
function updateSync() {
  const ats = Object.values(S.g).map(g => g.at).filter(Boolean);
  const el = document.getElementById('sync');
  if (!ats.length) { el.textContent = ''; return; }
  const m = Math.round((Date.now() - Math.min(...ats)) / 60000);
  el.textContent = m < 1 ? 'Google Calendar · just now' : `Google Calendar · ${m} min ago`;
}
setInterval(updateSync, 60000);
async function loadCalendars() {
  try {
    const r = await S.mcp.callTool(GC, 'list_calendars', {}, { cache: { staleTime: 5 * 60 * 1000 } });
    const p = r && r.payload; S.gCals = p && Array.isArray(p.calendars) ? p.calendars : [];
    S.gState = 'on'; S.gErr = null;
    schedule(); syncWatches(); syncNoSchoolWatches();
  } catch (err) {
    const info = gErrorFor(err);
    if (err && (err.code === 'not_in_manifest' || err.code === 'not_granted')) S.gState = 'off';
    else { S.gState = 'on'; S.gErr = info; }
    schedule();
  }
}
async function connectGoogle() {
  if (!S.mcp) return;
  S.gErr = null;
  await loadCalendars();
}
async function pushToGoogle(id, e) {
  if (!S.mcp) return;
  const cal = S.selCals.find(c => c !== 'primary' && (S.gCals || []).some(x => x.id === c && /family/i.test(x.summary || ''))) || 'primary';
  const input = { summary: e.title, calendarId: cal };
  if (e.allDay) { input.allDay = true; input.startTime = e.date + 'T00:00:00'; input.endTime = addDays(e.date, 1) + 'T00:00:00'; }
  else {
    const st = e.time || '09:00';
    let en = e.endTime; if (!en || en <= st) { const [h, m] = st.split(':').map(Number); en = `${pad(Math.min(23, h + 1))}:${pad(m)}`; }
    input.startTime = `${e.date}T${st}:00`; input.endTime = `${e.date}T${en}:00`;
  }
  const notes = [e.notes, e.owner && person(e.owner) ? `${person(e.owner).name} is on it.` : ''].filter(Boolean).join('\n');
  if (notes) input.description = notes;
  if (e.repeat && e.repeat.days && e.repeat.days.length) {
    const BY = ['SU','MO','TU','WE','TH','FR','SA'];
    let rule = 'RRULE:FREQ=WEEKLY;BYDAY=' + e.repeat.days.map(d => BY[d]).join(',');
    if (e.repeat.until) rule += ';UNTIL=' + e.repeat.until.replace(/-/g, '') + 'T235959Z';
    input.recurrenceData = [rule];
  }
  try {
    const r = await S.mcp.callTool(GC, 'create_event', input);
    const p = r && r.payload; const gid = p && (p.id || (p.event && p.event.id)) || null;
    await write(() => S.db.doc('events/' + id).update({ gcal: { calendarId: cal, id: gid } }));
    toast(`Added to Google Calendar (${calName(cal)})`);
    S.mcp.invalidate(GC, 'list_events').catch(() => {});
  } catch (err) {
    toast(err && err.code === 'server_unavailable' ? "Google Calendar didn't answer. Check Google before trying again so it isn't added twice." : gErrorFor(err).msg);
  }
}

// ---------- events wiring ----------
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'mic') { toggleMic(t); return; }
  if (a === 'wxconnect') { connectWeather(); return; }
  if (a === 'wxpick') { const st = JSON.parse(JSON.stringify(settings())); st.weather = { name: t.dataset.name, key: t.dataset.key }; S.settings = st; S.wxSearch = null; schedule(); if (await saveSettings(st)) { toast(`Weather: ${t.dataset.name}`); if (S.wxState === 'on') startWeather(); } return; }
  if (a === 'scrim') { if (e.target === t) closeSheet(); return; }
  if (a === 'close') { closeSheet(); return; }
  if (a === 'care') { if (!settings().people.length) { toast('Add who can cover care in Setup first.'); location.hash = '#family'; return; } careSheet(t.dataset.kid, t.dataset.block, t.dataset.ds); return; }
  if (a === 'newev') { if (guard()) eventSheet(null, t.dataset.ds); return; }
  if (a === 'ev') { const ev = S.events.find(x => x.id === t.dataset.id); if (ev && guard()) eventSheet(ev, t.dataset.ds); return; }
  if (a === 'gev') { gEventSheet(t.dataset.id, t.dataset.cal); return; }
  if (a === 'wk') { const d = Number(t.dataset.d); S.weekStart = d ? addDays(S.weekStart, d) : mondayOf(todayStr()); syncWatches(); syncNoSchoolWatches(); schedule(); return; }
  if (a === 'gconnect') { connectGoogle(); return; }
  if (a === 'gperm') { try { await S.perms.manage(); location.reload(); } catch { toast("Open this page's Permissions menu to turn Google Calendar back on."); } return; }
  if (a === 'daytype') { if (guard()) await setDayType(t.dataset.ds, t.dataset.v === '1'); return; }
  if (a === 'marknoschool') { if (!guard()) return; const days = t.dataset.days.split(','); for (const ds of days) await setDayType(ds, false); toast(`Marked ${days.length} day${days.length === 1 ? '' : 's'} as no school`); return; }
  if (a === 'meal') { if (guard()) mealSheet(t.dataset.ds, t.dataset.slot); return; }
  if (a === 'mwk') { const d = Number(t.dataset.d); S.mealWeek = d ? addDays(S.mealWeek, d) : defaultMealWeek(); if (S.plan && S.plan.status === 'ready') S.plan = { status: 'idle', ask: S.plan.ask }; schedule(); return; }
  if (a === 'mtolist') { const n = await addIngredients(weekIngredients(S.mealWeek)); toast(n ? `Added ${n} item${n === 1 ? '' : 's'} to the grocery list` : 'Everything is already on the list'); return; }
  if (a === 'mpuse') { const tl = document.getElementById('mp-tolist'); await usePlan(!tl || tl.checked); return; }
  if (a === 'mpdiscard') { S.plan = { status: 'idle', ask: S.plan && S.plan.ask }; schedule(); return; }
  if (a === 'bkdrive') { t.disabled = true; t.textContent = 'Backing up…'; await backupToDrive(false); schedule(); return; }
  if (a === 'bkdl') { downloadBackup(); return; }
  if (a === 'bkrestore') { doRestore(); return; }
  if (a === 'bkcancel') { S.restore = null; schedule(); return; }
  if (a === 'gclear') { const done = S.groceries.filter(g => g.done); for (const g of done) await write(() => S.db.doc('groceries/' + g.id).delete()); toast(`Cleared ${done.length} item${done.length === 1 ? '' : 's'}`); return; }
  if (a === 'gdel') { await write(() => S.db.doc('groceries/' + t.dataset.id).delete()); return; }
  if (a === 'tdel') { await write(() => S.db.doc('tasks/' + t.dataset.id).delete()); return; }
  if (a === 'color') {
    const st = JSON.parse(JSON.stringify(settings())); const it = st[t.dataset.kind].find(x => x.id === t.dataset.id); if (!it) return;
    it.color = t.dataset.c; S.settings = st; schedule(); await saveSettings(st); return;
  }
  if (a === 'rm') {
    if (!t.dataset.sure) { t.dataset.sure = '1'; t.textContent = 'Remove?'; t.style.fontSize = '.8rem'; return; }
    const st = JSON.parse(JSON.stringify(settings())); st[t.dataset.kind] = st[t.dataset.kind].filter(x => x.id !== t.dataset.id); S.settings = st; schedule(); await saveSettings(st); return;
  }
  if (a === 'srm') { const st = JSON.parse(JSON.stringify(settings())); st.stores.splice(Number(t.dataset.i), 1); S.settings = st; schedule(); await saveSettings(st); return; }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'bk-file') { const f = t.files && t.files[0]; t.value = ''; if (f) readRestoreFile(f); return; }
  const a = t.dataset && t.dataset.act; if (!a) return;
  if (a === 'gdone') { const done = t.checked; await write(() => S.db.doc('groceries/' + t.dataset.id).update({ done })); return; }
  if (a === 'tdone') { const done = t.checked; await write(() => S.db.doc('tasks/' + t.dataset.id).update({ done, doneAt: done ? Date.now() : 0 }), done ? 'Done' : null); return; }
  if (a === 'blk') { const st = JSON.parse(JSON.stringify(settings())); st.careBlocks = BLOCKS.map(b => b.key).filter(k => k === t.dataset.key ? t.checked : st.careBlocks.includes(k)); S.settings = st; schedule(); await saveSettings(st); return; }
  if (a === 'mslot') { const st = JSON.parse(JSON.stringify(settings())); st.mealSlots = MEAL_SLOTS.map(b => b.key).filter(k => k === t.dataset.key ? t.checked : st.mealSlots.includes(k)); S.settings = st; schedule(); await saveSettings(st); return; }
  if (a === 'schoolday') { const st = JSON.parse(JSON.stringify(settings())); const d = Number(t.dataset.d); st.schoolDays = [0,1,2,3,4,5,6].filter(x => x === d ? t.checked : st.schoolDays.includes(x)); S.settings = st; schedule(); await saveSettings(st); return; }
  if (a === 'kidschool') { const st = JSON.parse(JSON.stringify(settings())); const k = st.kids.find(x => x.id === t.dataset.id); if (!k) return; k.school = t.checked; S.settings = st; schedule(); await saveSettings(st); return; }
  if (a === 'bkauto') { saveLocal('fp.autoDrive', t.checked); if (t.checked) maybeAutoBackup(true); return; }
  if (a === 'mppick') { if (S.plan && S.plan.picked) { S.plan.picked[Number(t.dataset.i)] = t.checked; schedule(); } return; }
  if (a === 'pat') {
    const { kid: k, block: b, d } = t.dataset;
    await setWeekly(k, b, nextOnOrAfter(todayStr(), Number(d)), t.value); return;
  }
  if (a === 'rename') { const name = t.value.trim(); if (!name) return; const st = JSON.parse(JSON.stringify(settings())); const it = st[t.dataset.kind].find(x => x.id === t.dataset.id); if (!it || it.name === name) return; it.name = name; S.settings = st; await saveSettings(st); schedule(); return; }
  if (a === 'srename') { const name = t.value.trim(); if (!name) return; const st = JSON.parse(JSON.stringify(settings())); st.stores[Number(t.dataset.i)] = name; S.settings = st; await saveSettings(st); schedule(); return; }
  if (a === 'cal') {
    const sel = S.selCals.filter(c => c !== t.dataset.id);
    if (t.checked) sel.push(t.dataset.id);
    S.selCals = sel; saveLocal('fp.cals', sel); syncWatches(); syncNoSchoolWatches(); schedule(); return;
  }
});
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'wxform') { searchPlace(f.querySelector('#wx-q').value.trim()); return; }
  if (f.id === 'mpform') {
    if (!S.sample) return;
    if (!guard()) return;
    planMeals(f.querySelector('#mp-ask').value.trim(), f.querySelector('#mp-empty').checked);
    return;
  }
  if (f.id === 'gform') {
    const name = f.querySelector('#g-name').value.trim(); if (!name) return;
    const store = f.querySelector('#g-store').value; f.querySelector('#g-name').value = '';
    await write(() => S.db.collection('groceries').doc(uid()).set({ name, store, done: false, createdAt: Date.now() }));
    f.querySelector('#g-name') && document.getElementById('g-name').focus();
    return;
  }
  if (f.id === 'tform') {
    const title = f.querySelector('#t-title').value.trim(); if (!title) return;
    const owner = f.querySelector('#t-owner').value, due = f.querySelector('#t-due').value;
    f.querySelector('#t-title').value = ''; f.querySelector('#t-due').value = '';
    await write(() => S.db.collection('tasks').doc(uid()).set({ title, owner, due, done: false, createdAt: Date.now() }), 'Task added');
    return;
  }
  if (f.dataset.add) {
    const kind = f.dataset.add; const inp = f.querySelector('input'); const name = inp.value.trim(); if (!name) return; inp.value = '';
    const st = JSON.parse(JSON.stringify(settings()));
    if (kind === 'stores') st.stores.push(name);
    else { const used = st[kind].map(x => x.color); st[kind].push({ id: uid(), name, color: COLORS.find(c => !used.includes(c)) || COLORS[st[kind].length % 8] }); }
    S.settings = st; schedule(); await saveSettings(st);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function route() {
  const h = (location.hash || '').slice(1);
  S.view = ['today','week','groceries','tasks','family'].includes(h) ? h : 'today';
  if (S.view === 'family' && S.mcp && S.gState === 'on' && !S.gCals) loadCalendars();
  schedule();
}
window.addEventListener('hashchange', route);

// ---------- boot ----------
function defaultMealWeek() { const t = todayStr(); return dowOf(t) === 0 ? addDays(t, 1) : mondayOf(t); }
S.weekStart = mondayOf(todayStr());
S.mealWeek = defaultMealWeek();
route();
// a new day while the page stays open
let lastDay = todayStr();
setInterval(() => { if (todayStr() !== lastDay) { lastDay = todayStr(); S.weekStart = mondayOf(lastDay); syncWatches(); syncNoSchoolWatches(); schedule(); } }, 60000);

(async () => {
  const c = window.claude;
  if (!c || !c.use) { S.dbMissing = true; S.settings = null; S.sample = null; schedule(); S.gState = 'unavailable'; return; }
  const [db, user, mcp, perms, sample, downloads, dict] = await Promise.all([c.use('db'), c.use('user'), c.use('mcp'), c.use('permissions'), c.use('sample'), c.use('downloads'), c.use('dictation')]);
  S.db = db; S.user = user; S.mcp = mcp; S.perms = perms; S.sample = sample; S.downloads = downloads; S.dict = dict; if (dict) { wireDictation(dict); schedule(); }
  if (user) { try { const w = await user.can('data.write'); if (w === false) S.canWrite = false; } catch {} }
  if (!db) { S.dbMissing = true; schedule(); }
  else {
    const err = e => { if (e && e.code === 'revoked') { S.dbMissing = true; schedule(); } };
    db.doc('family/settings').onSnapshot(s => { S.settings = s.exists ? { ...s.data() } : {}; if (S.wxState === 'on' && settings().weather && settings().weather.key !== wxKey) startWeather(); schedule(); }, err);
    db.doc('family/patterns').onSnapshot(s => { const d = s.exists ? s.data() : null; S.patterns = (d && d.p) || {}; S.rules = (d && d.r) || {}; schedule(); }, err);
    db.collection('care').where('date', '>=', addDays(todayStr(), -60)).onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.care = m; if (!S.careReady) { S.careReady = true; applyNoSchool(); } schedule(); }, err);
    db.collection('events').onSnapshot(s => { S.events = s.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, err);
    db.collection('groceries').onSnapshot(s => { S.groceries = s.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, err);
    db.collection('tasks').onSnapshot(s => { S.tasks = s.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, err);
    db.collection('meals').where('date', '>=', addDays(todayStr(), -60)).onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.meals = m; schedule(); }, err);
    setTimeout(() => maybeAutoBackup(false), 4000);
    db.collection('gmeta').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); S.gmeta = m; schedule(); }, err);
  }
  if (!mcp) { S.gState = 'unavailable'; schedule(); return; }
  const wst = perms ? await perms.state('mcp:' + AW).catch(() => 'prompt') : 'prompt';
  if (wst === 'granted') { S.wxState = 'on'; startWeather(); } else S.wxState = 'ask';
  let st = 'prompt';
  if (perms) st = await perms.state('mcp:' + GC).catch(() => 'unavailable');
  if (st === 'granted') { S.gState = 'on'; schedule(); loadCalendars(); }
  else if (st === 'denied') { S.gState = 'on'; S.gErr = gErrorFor({ code: 'not_in_manifest' }); schedule(); }
  else { S.gState = 'ask'; schedule(); }
})();
})();
</script>
