<title>The Zhang-Wolfe House</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a house ledger on one phone column. Masthead with the family monogram over a woven rug border,
   then the page; fixed tab bar at the bottom; full-height sheets for tasks, appliances, visits and settings.
   Palette: silk-rug indigo + walnut floorboards; leaf green and madder red carry status. */
:root{
  --bg:#f4f4f7; --surface:#ffffff; --surface-2:#e9e9f0; --ink:#1e1c2a; --muted:#625f73; --line:#dcdbe5;
  --accent:#33408c; --accent-ink:#ffffff; --accent-soft:#e3e6f6;
  --wood:#8a5634; --wood-soft:#f2e7de;
  --ok:#2c7349; --ok-soft:#dcefe2; --warn:#94600f; --warn-soft:#f6e8cc; --due:#a63d33; --due-soft:#f6dcd8;
  --f-display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14141b; --surface:#1d1d27; --surface-2:#282834; --ink:#e8e7f0; --muted:#a09db2; --line:#302f3d;
  --accent:#a3adff; --accent-ink:#14163a; --accent-soft:#262b4d; --wood:#d9a07a; --wood-soft:#33261e;
  --ok:#79c99a; --ok-soft:#1b3125; --warn:#e2b257; --warn-soft:#3a2f17; --due:#f08a7d; --due-soft:#3d2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14141b; --surface:#1d1d27; --surface-2:#282834; --ink:#e8e7f0; --muted:#a09db2; --line:#302f3d;
  --accent:#a3adff; --accent-ink:#14163a; --accent-soft:#262b4d; --wood:#d9a07a; --wood-soft:#33261e;
  --ok:#79c99a; --ok-soft:#1b3125; --warn:#e2b257; --warn-soft:#3a2f17; --due:#f08a7d; --due-soft:#3d2220; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.05;letter-spacing:.005em}
h3{font-size:1rem;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* masthead */
.house{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding-block:18px 12px}
.mono{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--wood);color:var(--wood);display:grid;place-items:center;
  font-family:var(--f-display);font-size:1.35rem;font-style:italic;letter-spacing:.02em;background:var(--wood-soft)}
.house h1{font-size:1.75rem}
.greet{margin:0 0 2px;color:var(--muted);font-size:.82rem}
.gear{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.gear:hover{background:var(--surface-2)}
.gear:focus-visible{outline:3px solid var(--accent)}
.gear svg{width:22px;height:22px}
.rug{height:14px;border-block:2px solid var(--wood);margin-bottom:18px;
  background:
   linear-gradient(135deg,var(--accent) 25%,transparent 25%) 0 0/16px 10px repeat-x,
   linear-gradient(225deg,var(--accent) 25%,transparent 25%) 0 0/16px 10px repeat-x,
   linear-gradient(45deg,var(--wood) 25%,transparent 25%) 8px 100%/16px 6px repeat-x,
   linear-gradient(315deg,var(--wood) 25%,transparent 25%) 8px 100%/16px 6px repeat-x,
   var(--wood-soft)}
.pagehead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.pagehead h2{font-size:2.1rem}
.pagehead .sub{color:var(--muted);font-size:.88rem;text-align:right}
.view{display:flex;flex-direction:column;gap:22px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.section-h h2{font-size:1.5rem}
.section-h .aside{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.92rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:8px 4px;border-radius:9px;font-size:.92rem;color:var(--muted);min-height:24px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:3px solid var(--accent)}
.finder{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.finder .lab{font-size:.85rem;color:var(--muted);font-weight:700}
.fit{color:var(--muted);font-size:.88rem;margin:0}
ul.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px 10px 10px;border-top:1px solid var(--line);position:relative}
.row.noTick{grid-template-columns:1fr auto;padding-left:16px}
.row:first-child{border-top:0}
.tick{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;flex:none}
.tick:hover,.tick:focus-visible{border-color:var(--ok);color:var(--ok)}
.tick svg{width:20px;height:20px}
.row .main{all:unset;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px;padding-block:2px}
.row .main:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
.row .name{font-weight:700;overflow-wrap:anywhere}
.row .meta{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.meter{position:absolute;left:0;bottom:0;height:3px;background:var(--st,var(--line));opacity:.85}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--st-soft);color:var(--st)}
.st-ok{--st:var(--ok);--st-soft:var(--ok-soft)}
.st-soon{--st:var(--warn);--st-soft:var(--warn-soft)}
.st-due{--st:var(--due);--st-soft:var(--due-soft)}
.st-new,.st-aside{--st:var(--muted);--st-soft:var(--surface-2)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted)}
.empty strong{color:var(--ink)}
.banner{background:var(--accent-soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.banner p{margin:0}
.cleaners{background:var(--wood-soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.cleaners .big{font-family:var(--f-display);font-size:1.45rem;line-height:1.1}
.cleaners p{margin:0}
.cleaners .eyebrow{color:var(--wood)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;min-height:46px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wood{background:var(--wood);border-color:var(--wood);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn.danger{color:var(--due)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shop{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.shop ul{margin:6px 0 0;padding-left:18px}
.shop li{margin:3px 0}
details.aside{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.aside>summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
details.aside>summary::-webkit-details-marker{display:none}
details.aside>summary .hint{font-weight:400;color:var(--muted);font-size:.85rem}
details.aside ul.rows{border:0;border-radius:0;border-top:1px solid var(--line)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:.76rem;color:var(--muted);min-height:44px;justify-content:center}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
nav.tabs button:focus-visible{outline:3px solid var(--accent)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding-block:6px;z-index:2}
.sheet h2{font-size:2rem}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--surface)}
button.badge{cursor:pointer;color:var(--wood);border-color:var(--wood)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card ol,.card ul{margin:0;padding-left:20px}
.card li{margin:4px 0}
.card p{margin:0}
.card.eco h3{color:var(--ok)}
.card.alt h3{color:var(--accent)}
.card.warn{background:var(--due-soft);border-color:transparent}
.card.warn h3{color:var(--due)}
textarea,select,input[type="date"],input[type="text"],input[type="number"],input[type="url"]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
label.lbl{font-size:.85rem;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.check .m{margin-left:auto;color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.hist{list-style:none;padding:0;margin:0}
.hist li{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.hist li:first-child{border-top:0}
.hist .d{font-variant-numeric:tabular-nums;font-weight:700}
.hist .n{color:var(--muted);overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.facts dt{color:var(--muted);font-size:.88rem}
.facts dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:30;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:6px 8px;min-height:36px}
.kit{display:flex;flex-direction:column;gap:10px}
.good{color:var(--ok);font-weight:700}
.bad{color:var(--due);font-weight:700}
.mix{display:flex;flex-direction:column;gap:8px}
.mix .card{background:var(--due-soft);border:0}
.mix b{color:var(--due)}
.foot{color:var(--muted);font-size:.8rem;text-align:center;padding-top:14px}
.form{display:flex;flex-direction:column;gap:12px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav .range{font-family:var(--f-display);font-size:1.4rem;text-align:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:2.1rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .k{color:var(--muted);font-size:.82rem}
.tile .d{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.tile.save{background:var(--ok-soft);border-color:transparent}
.tile.save .v{color:var(--ok)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.9rem}
.bar .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.bar.wood .fill{background:var(--wood)}
.bar .n{color:var(--muted);font-variant-numeric:tabular-nums}
.daylog,.card ul.daylog{list-style:none;margin:0;padding:0}
.daylog li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:center}
.daylog li:first-child{border-top:0}
.daylog .day{grid-column:1/-1;font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding-top:6px}
.daylog .x{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;text-align:right}
.daylog .nt,.daylog .when{grid-column:1/-1;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.daylog .when{grid-column:auto;display:block}
.fineprint{color:var(--muted);font-size:.82rem;margin:0}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>

<div class="wrap">
  <header class="house">
    <div class="mono" id="mono" aria-hidden="true">ZW</div>
    <div><p class="greet" id="greet"></p><h1 id="house">The Zhang-Wolfe House</h1></div>
    <button class="gear" data-act="settings" aria-label="Household settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

</nav>

<script>
/* ---------------- Task library ----------------
   e = repeat every N days, m = minutes of hands-on time
   s = steps, sup = supplies, eco = the gentle / right way, alt = stronger option, w = watch out */
var L = [];
function T(id,list,area,name,e,m,o){o=o||{};o.id=id;o.list=list;o.area=area;o.name=name;o.e=e;o.m=m;L.push(o)}
function C(id,area,name,e,m,o){T(id,"clean",area,name,e,m,o)}
function U(id,area,name,e,m,o){T(id,"upkeep",area,name,e,m,o)}

/* Kitchen */
C("k-counters","Kitchen","Wipe counters, stovetop & sink",2,10,{sup:"Dish soap, microfiber cloth",s:["Clear the counters and put things away.","Spray or wipe with warm water and a few drops of dish soap.","Wipe the stovetop while it's cool. Lift grates if crumbs fell under.","Rinse the sink and wipe the faucet handles dry."],eco:"Warm soapy water handles daily grime. Disinfectant is only needed after raw meat.",alt:"After raw meat or eggs, use 3% hydrogen peroxide or a diluted bleach solution (1 tbsp bleach per quart water) and let it sit 1 minute.",w:"Don't use vinegar or lemon on marble, granite, or quartz. Acid etches stone and wears down sealer."});
C("k-sink","Kitchen","Scrub & deodorize kitchen sink",7,5,{sup:"Baking soda, dish soap, scrub brush, lemon (optional)",s:["Empty the sink and rinse.","Sprinkle baking soda over the basin and scrub with a damp brush.","Scrub around the drain lip and under the faucet base with an old toothbrush.","Rinse and dry. Run a lemon wedge through the disposal or drain if it smells."],eco:"Baking soda is a gentle abrasive that won't scratch stainless.",alt:"Bar Keepers Friend for hard-water rings and rust spots on stainless.",w:"Scrub stainless along the grain."});
C("k-micro","Kitchen","Clean the microwave",14,10,{sup:"Microwave-safe bowl, water, lemon or vinegar, cloth",s:["Fill a bowl with 1 cup water and a lemon slice or 1 tbsp vinegar.","Microwave on high 3–5 minutes, then leave the door shut 5 more minutes to steam.","Take out the turntable and wash it in the sink.","Wipe the inside top to bottom. Splatters will lift off easily."],eco:"Steam does the scrubbing. No sprays needed.",w:"Put a wooden spoon in the bowl to stop water from superheating and boiling over."});
C("k-fridge-out","Kitchen","Fridge clean-out",7,10,{sup:"Damp cloth",s:["Toss expired leftovers and wilted produce. Do this the night before trash day.","Wipe any drips on shelves.","Move older items to the front."],eco:"Cuts food waste and keeps smells from building up."});
C("k-fridge-deep","Kitchen","Deep clean the fridge",90,45,{sup:"Baking soda, warm water, microfiber cloths, cooler",s:["Move food into a cooler or bunch it on one shelf.","Pull out drawers and shelves. Wash them in warm soapy water.","Wipe the interior with 2 tbsp baking soda dissolved in 1 quart warm water.","Wipe the door seals with an old toothbrush. Crumbs hide in the folds.","Dry everything and reload. Leave an open box of baking soda on a back shelf."],eco:"Baking soda cleans and deodorizes without leaving a scent on food.",w:"Let cold glass shelves warm up before washing in hot water, or they can crack."});
C("k-coils","Kitchen","Vacuum fridge coils",180,15,{sup:"Vacuum with crevice tool, coil brush",s:["Unplug the fridge or turn it off.","Pop off the bottom front grille, or pull the fridge out to reach coils on the back.","Brush and vacuum dust and pet hair off the coils.","Vacuum the floor under it and plug it back in."],eco:"Clean coils use less electricity. Cat hair clogs them faster."});
C("k-oven","Kitchen","Clean the oven",90,30,{sup:"Baking soda, water, spray bottle of vinegar, scraper, cloths",s:["Remove racks (see the oven racks task).","Mix 1/2 cup baking soda with a few tbsp water into a spreadable paste.","Spread it over the inside, avoiding heating elements. Leave overnight.","Wipe out the paste with a damp cloth. Use a plastic scraper on stuck spots.","Spritz vinegar on leftover white residue. It foams. Wipe until clean."],eco:"The paste softens baked-on grease overnight with zero fumes.",alt:"Self-clean cycle: open windows and keep cats and kids out of the kitchen, since the smoke and fumes are irritating (and can be fatal to pet birds). For a non-self-cleaning oven, a fume-free commercial oven cleaner works fast on heavy carbon.",w:"Don't use commercial oven cleaner inside a self-cleaning oven unless the manual allows it. It can damage the enamel."});
C("k-racks","Kitchen","Soak & scrub oven racks",180,20,{sup:"Bathtub or utility tub, old towel, dish soap, dryer sheets (optional), scrub brush",s:["Lay an old towel in the tub to protect it.","Put racks in and cover with hot water.","Add 1/2 cup dish soap (or a few dryer sheets). Soak overnight.","Scrub with a brush, rinse, and dry."],eco:"A long hot soak does most of the work.",alt:"Bar Keepers Friend paste for leftover brown spots.",w:"Clean the tub right after so kids don't bathe in greasy residue."});
C("k-trays","Kitchen","Deep clean baking trays",180,20,{sup:"Baking soda, 3% hydrogen peroxide, scrub sponge",s:["Sprinkle baking soda over the tray.","Pour hydrogen peroxide over it, then add another layer of baking soda.","Let it sit 2 hours to overnight.","Scrub off the brown buildup and rinse."],eco:"Baking soda and peroxide lift baked-on polymerized oil without harsh fumes.",alt:"Bar Keepers Friend works faster on stainless and aluminum sheets. Spot-test on aluminum first.",w:"Skip abrasives on nonstick trays. They strip the coating."});
C("k-dw-filter","Kitchen","Clean dishwasher filter",30,10,{sup:"Soft brush, dish soap",s:["Pull out the bottom rack.","Twist out the cylindrical filter, then lift out the flat mesh under it.","Rinse under hot water and scrub gently with a soft brush and soap.","Wipe out the sump area and put the filters back."],eco:"A clean filter means cleaner dishes and less need for extra rinse cycles.",w:"Make sure the filter clicks back in place, or food bits can reach the pump."});
C("k-dw-deep","Kitchen","Descale & freshen dishwasher",90,10,{sup:"Citric acid or dishwasher cleaner, damp cloth",s:["Wipe the door edges and gasket where gunk collects.","Clean the filter first.","Put 2 tbsp citric acid in the detergent cup (or use a cleaner tablet).","Run an empty hot cycle."],eco:"Citric acid descales without odor.",alt:"Affresh or Finish dishwasher cleaner tablets.",w:"Some manufacturers advise against frequent vinegar cycles because it can wear rubber gaskets. Citric acid or a cleaner made for dishwashers is safer."});
C("k-faucet","Kitchen","Soak kitchen faucet aerator in vinegar",90,5,{sup:"White vinegar, zip-top bag, rubber band, old toothbrush",s:["Fill a zip-top bag with enough vinegar to cover the faucet tip.","Rubber-band it over the spout so the aerator is submerged.","Leave 1 hour.","Remove, scrub the holes with an old toothbrush, and run hot water."],eco:"Vinegar dissolves mineral scale with no harsh chemicals.",w:"Limit soaks on brass, gold, or matte black finishes to 15–20 minutes. Test first."});
C("k-hood","Kitchen","Degrease range hood filter",90,15,{sup:"Large pot or sink, boiling water, dish soap, baking soda, brush",s:["Pop the metal mesh filter out of the hood.","Fill the sink with very hot water, a squirt of dish soap, and 1/4 cup baking soda.","Soak 15–20 minutes, then scrub with a soft brush.","Rinse, dry fully, and reinstall. Wipe the hood underside too."],eco:"Hot water, soap and baking soda cut grease without solvents.",alt:"Many stainless mesh filters can go in the dishwasher. Check the manual.",w:"Charcoal (recirculating) filters can't be washed. Replace them instead."});
C("k-cabinets","Kitchen","Wipe cabinet fronts & handles",30,15,{sup:"Dish soap, microfiber cloths",s:["Mix a few drops of dish soap in warm water.","Wipe cabinet fronts, paying attention near the stove and trash.","Wipe handles and pulls (sticky kid hands!).","Dry with a second cloth."],eco:"Dish soap is all most cabinets need.",w:"Avoid vinegar and heavy water on wood cabinets. Wring your cloth well."});
C("k-boards","Kitchen","Oil wooden boards & spoons",30,5,{sup:"Food-grade mineral oil or board cream, coarse salt, lemon",s:["Scrub boards with coarse salt and half a lemon to deodorize. Rinse and dry fully.","Rub a thin coat of mineral oil on all sides.","Let it soak in overnight and wipe off extra."],eco:"Oiling keeps wood from cracking so it lasts for years.",w:"Never put wooden boards in the dishwasher. Don't use cooking oils like olive oil, which go rancid."});
C("k-kettle","Kitchen","Descale kettle",60,5,{sup:"Citric acid or white vinegar",s:["Fill halfway with water and add 1 tbsp citric acid (or half vinegar, half water).","Bring to a boil, then let sit 20 minutes.","Pour out, rinse, and boil once with plain water."],eco:"Citric acid leaves no smell and works fast."});
C("k-small","Kitchen","Clean toaster & small appliances",30,10,{sup:"Damp cloth, pastry brush",s:["Unplug the toaster. Empty the crumb tray over the trash.","Turn it upside down and shake gently.","Wipe the outside of the toaster, blender base, and coffee maker."],w:"Never put a knife or fork into a plugged-in toaster."});
C("k-sponge","Kitchen","Swap sponge & wash dish brush, rags",14,5,{sup:"New sponge",s:["Toss the old sponge.","Run the dish brush through the dishwasher on the top rack.","Wash dishcloths and towels on hot."],eco:"Natural cellulose sponges compost. Swedish dishcloths last longer than sponges."});
C("k-trash","Kitchen","Wash trash & recycling bins",60,15,{sup:"Hose or tub, dish soap, brush, baking soda",s:["Empty the bin and take it outside or to the tub.","Scrub with hot soapy water and rinse.","Dry in the sun if you can.","Sprinkle a little baking soda in the bottom before the new bag."],eco:"Sunlight helps dry and deodorize."});
C("k-pantry","Kitchen","Pantry check & wipe shelves",180,30,{sup:"Damp cloth, trash bag",s:["Pull everything out a shelf at a time.","Toss expired items and watch for pantry moths (webbing in grains).","Wipe shelves and put things back, oldest in front."],w:"If you find pantry moths, toss infested food and freeze new grains for 4 days."});

/* Espresso */
C("e-weekly","Espresso","Clean group head, basket & drip tray",7,10,{sup:"Group brush, microfiber cloth, warm water",s:["Brush around the group gasket to clear grounds.","Backflush with plain water using a blind basket if your machine allows.","Soak baskets and portafilter (not the handle) in hot water.","Empty and wash the drip tray. Wipe the steam wand and purge it."],eco:"A weekly water rinse means you need detergent less often."});
C("e-backflush","Espresso","Backflush with espresso cleaner",30,15,{sup:"Espresso machine cleaner (Cafiza, Urnex), blind basket",s:["Check your manual: backflushing only works on machines with a 3-way solenoid valve.","Put 1/2 tsp cleaner in the blind basket and lock in.","Run 10 seconds, stop 10 seconds. Repeat 5 times.","Rinse: repeat with plain water 5+ times. Pull and discard one shot."],eco:"Espresso cleaners are made to rinse clean. Coffee oils turn rancid without them.",w:"Don't use dish soap. It leaves residue and flavor."});
C("e-grinder","Espresso","Clean grinder burrs",60,15,{sup:"Grinder cleaning tablets or brush, small vacuum",s:["Run grinder cleaning pellets (Grindz) through, then 10–20g of coffee to purge.","Or unplug, remove the top burr per your manual, and brush oils and fines out.","Vacuum the chute and put it back together."],w:"Don't use rice. It's harder than coffee and can strain burrs and motors."});
C("e-descale","Espresso","Descale espresso machine",90,30,{sup:"Manufacturer's descaler or citric acid",s:["Read your manual first. Some dual-boiler machines should not be descaled at home.","Mix descaler in the tank as directed.","Run it through the group and steam wand per the manual.","Flush with at least two full tanks of fresh water."],eco:"Using filtered or softened water greatly reduces how often you need this.",w:"Avoid vinegar in espresso machines. It can harm seals and leave a taste."});

/* Bathrooms */
C("b-toilet","Bathrooms","Clean all 3 toilets",7,20,{sup:"Toilet brush, baking soda, castile soap or toilet cleaner, cloth",s:["Sprinkle baking soda in the bowl and add a squirt of castile soap. Let sit while you do the rest.","Wipe the outside top to bottom: tank, seat, hinges, base, and the floor around it.","Scrub the bowl, under the rim especially, and flush."],eco:"Baking soda plus castile soap cleans the bowl well week to week.",alt:"A commercial toilet cleaner or a bleach cleaner after stomach bugs.",w:"Close lids so curious cats and kids stay out of the cleaning water."});
C("b-sinks","Bathrooms","Bathroom sinks, counters & mirrors (3)",7,20,{sup:"Microfiber cloths, dish soap, glass cloth",s:["Clear the counter.","Wipe the sink and counter with soapy water. Scrub around the faucet base with a toothbrush.","Clean the mirror with a damp microfiber cloth, then a dry one."],eco:"Good microfiber and plain water leave mirrors streak-free.",alt:"A 50/50 vinegar and water spray for hard water spots on chrome and glass.",w:"No vinegar on marble or natural stone vanities."});
C("b-shower","Bathrooms","Scrub both tubs & showers",7,30,{sup:"Baking soda, dish soap, scrub brush, squeegee",s:["Mix baking soda with a squirt of dish soap into a paste.","Scrub tub, walls and fixtures, then rinse.","Squeegee glass doors.","Going forward: squeegee after showers to slow buildup."],eco:"Dish soap breaks down body oils. Baking soda handles soap scum.",alt:"For heavy hard-water scale on glass, a vinegar spray or CLR. Rinse well.",w:"Never use vinegar and bleach in the same session. Rinse completely between products."});
C("b-towels","Bathrooms","Wash towels & bath mats",7,5,{s:["Wash bath towels hot.","Wash bath mats every other time, or weekly with kids splashing.","Dry fully to stop mildew smell."],eco:"Skip fabric softener. It coats towels and makes them less absorbent. Use 1/2 cup vinegar in the rinse instead."});
C("b-toys","Bathrooms","Clean kids' bath toys",14,10,{sup:"White vinegar, bowl, dish soap",s:["Squeeze water out of squirt toys.","Soak 1 hour in equal parts hot water and white vinegar, squeezing it through.","Rinse, squeeze out, and air dry upside down.","Toss anything with black mold inside."],eco:"Seal squirt holes with hot glue so water never gets in.",alt:"Hard plastic toys can go on the dishwasher's top rack."});
C("b-holder","Bathrooms","Wash toothbrush holder & soap dish",14,5,{s:["Run them through the dishwasher or scrub with hot soapy water.","Dry before putting brushes back."]});
C("b-showerhead","Bathrooms","Descale showerhead",90,5,{sup:"White vinegar, zip bag, rubber band",s:["Fill a bag with vinegar and rubber-band it over the showerhead.","Soak 1 hour (or overnight for chrome).","Remove, run hot water, and scrub nozzles with a toothbrush."],eco:"Vinegar dissolves the scale that blocks spray holes.",w:"Limit soaks to 15–20 minutes on brass, nickel, or matte black finishes."});
C("b-grout","Bathrooms","Scrub grout & treat mildew",90,30,{sup:"Oxygen bleach powder or 3% hydrogen peroxide, baking soda, grout brush",s:["Make a paste of baking soda and hydrogen peroxide (or oxygen bleach and water).","Spread on grout lines and let sit 10–15 minutes.","Scrub with a stiff grout brush and rinse well.","Run the fan for an hour afterwards."],eco:"Oxygen bleach and peroxide whiten grout without chlorine fumes.",alt:"For black mold in caulk, a bleach gel pen works well. Ventilate and keep cats and kids out until it's rinsed. If mold is inside the caulk, re-caulk.",w:"Never mix bleach with vinegar, ammonia, or other cleaners."});
C("b-curtain","Bathrooms","Wash shower curtain & liner",60,5,{s:["Put the liner and curtain in the washer with 2–3 towels (they scrub).","Wash warm with detergent and 1/2 cup baking soda.","Add 1/2 cup vinegar to the rinse.","Hang back up to dry."],eco:"Washing makes plastic liners last much longer."});
C("b-drains","Bathrooms","Clear hair from drains",30,10,{sup:"Plastic drain snake (Zip-It), gloves",s:["Pull the stopper if possible.","Push the plastic snake down, twist, and pull out the hair.","Flush with very hot water."],eco:"Mechanical removal beats chemicals and is safer for pipes.",w:"Skip chemical drain openers. They're dangerous around kids and can damage pipes."});
C("b-fan","Bathrooms","Vacuum exhaust fan cover",180,10,{s:["Turn off the fan.","Vacuum the grille with a brush attachment.","For a deeper clean, pull the cover down and wash it in soapy water."],eco:"A clean fan pulls out moisture better, which prevents mildew."});
C("b-meds","Bathrooms","Clear out expired meds & products",365,20,{s:["Check expiration dates on medicines, sunscreen, and cosmetics.","Take old meds to a pharmacy take-back bin.","Move anything kids could reach up high or into a locked box."],w:"Children's poisoning risk: keep meds and vitamins locked or high, even ones with child-proof caps."});

/* Floors & rugs */
C("f-vacuum","Floors & rugs","Vacuum floors & rugs",4,45,{sup:"Vacuum with brush-roll on/off control",s:["Hardwood: use the hard-floor setting with the brush roll off.","Silk and wool rugs: suction only. Turn the beater bar off or use an upholstery head.","Vacuum in the direction of the pile, not against it.","Keep the vacuum off fringe. Comb fringe gently by hand instead."],eco:"Frequent vacuuming keeps grit from wearing down floor finish and rug fibers.",w:"A spinning beater bar frays and fuzzes silk and wool."});
C("f-mop","Floors & rugs","Damp-mop the wood floors",14,45,{sup:"Microfiber flat mop, pH-neutral hardwood cleaner (e.g. Bona)",s:["Vacuum first.","Lightly mist a pH-neutral hardwood cleaner, or dampen the pad and wring it until barely damp.","Mop with the grain, a small section at a time.","Wipe up anything wet. Keep cats off until dry."],eco:"A well-wrung microfiber pad with a little cleaner is all hardwood needs.",w:"Avoid vinegar (dulls the finish over time), steam mops, oil soaps (leave a film), and puddles of water. If your floors are oil-finished instead of polyurethane, use a cleaner made for oiled floors."});
C("f-rug-spot","Floors & rugs","Check rugs for spots & stains",14,10,{sup:"White cloths, cool water, wool-safe detergent",s:["Look for cat hairballs, food, and spills.","Blot from the outside in with a white cloth and cool water. Don't rub.","For stubborn spots, use a wool-safe detergent (look for the WoolSafe label).","Blot dry, then prop the area up to air dry."],eco:"Water and gentle blotting fix most fresh spots.",w:"Enzyme cleaners with protease can damage silk and wool. Spot-test or use a WoolSafe-approved product. Never use baking soda, ammonia, or oxygen bleach on silk or wool. Silk can lose dye easily: test first."});
C("f-rug-rotate","Floors & rugs","Rotate rugs & clean underneath",180,20,{s:["Roll up or flip the rug back.","Vacuum the rug's back side and the floor underneath.","Look for clothes moths or carpet beetles (tiny larvae, webbing, bald patches), especially under furniture.","Rotate the rug 180° so sun and traffic wear evenly."],eco:"Moths love undisturbed wool. Regular vacuuming under furniture is the best prevention.",w:"If you find moths, call a rug cleaner. They can treat it without damaging fibers."});
C("f-rug-pro","Floors & rugs","Professional rug cleaning",730,0,{s:["Book a cleaner who specializes in handmade wool and silk rugs.","Plan for every 1–2 years for high traffic, 3–5 for low."],w:"Steam cleaning or home carpet shampooers can shrink wool and bleed silk dyes. Don't DIY a full wash."});
C("f-baseboards","Floors & rugs","Wipe baseboards",60,20,{sup:"Damp microfiber cloth",s:["Vacuum along baseboards with a brush attachment.","Wipe with a damp cloth.","Use a melamine sponge on scuffs."],eco:"A dryer sheet wiped over clean baseboards helps repel dust and cat hair."});
C("f-mats","Floors & rugs","Shake or wash doormats",30,5,{s:["Shake outdoor mats.","Machine-wash washable mats.","Sweep or vacuum under them."]});

/* Whole house */
C("h-dust","Whole house","Dust surfaces",7,40,{sup:"Damp microfiber cloth",s:["Work top to bottom, room by room.","Use a slightly damp microfiber cloth so dust sticks instead of flying.","Dust shelves, tables, lamps, picture frames, and electronics.","Vacuum the floor after."],eco:"Microfiber holds dust without spray.",w:"Don't use sprays with essential oils. They're toxic to cats."});
C("h-high","Whole house","Dust ceiling fans, lights & up high",60,25,{sup:"Pillowcase, extendable duster, step stool",s:["Slide an old pillowcase over each fan blade and pull back. The dust stays inside.","Dust light fixtures, door frames, and tops of cabinets and fridge.","Vacuum the floor after."],eco:"The pillowcase trick keeps dust off beds and floors."});
C("h-touch","Whole house","Disinfect switches, knobs & remotes",14,10,{sup:"70% isopropyl alcohol or hydrogen peroxide, cloth",s:["Wipe light switches, doorknobs, cabinet pulls, remotes, and phone screens.","Let surfaces stay wet for the time on the label.","Do this more often in cold and flu season."],eco:"Alcohol evaporates fast and is safe for electronics.",alt:"After stomach bugs, use a bleach solution. Alcohol and vinegar don't reliably kill norovirus.",w:"Spray the cloth, not the switch."});
C("h-couch","Whole house","Vacuum couch & under cushions",30,15,{sup:"Vacuum upholstery tool, rubber glove or lint roller",s:["Pull off cushions and vacuum crumbs and toys out of the crevices.","Vacuum the cushions on all sides.","Wipe a damp rubber glove across fabric to pull up cat hair."],eco:"A rubber glove or squeegee lifts cat hair better than most attachments."});
C("h-walls","Whole house","Spot-clean walls & doors",30,15,{sup:"Warm soapy water, melamine sponge",s:["Look for handprints around switches and doorways and crayon at kid height.","Try warm soapy water first.","Use a melamine sponge (Magic Eraser) lightly on tougher marks."],eco:"Plain soap and water won't strip paint.",w:"Melamine sponges are fine abrasives and can dull flat or matte paint. Test in a hidden spot."});
C("h-windows","Whole house","Wash windows (inside)",90,90,{sup:"Squeegee, microfiber, dish soap",s:["Mix a few drops of dish soap in a bucket of warm water.","Wash the glass, then squeegee from the top down, wiping the blade each pass.","Wipe the edges with a dry microfiber.","Work on a cloudy day so it doesn't dry streaky."],eco:"Dish soap water and a squeegee beat any spray."});
C("h-tracks","Whole house","Vacuum window & door tracks",90,20,{sup:"Crevice tool, old toothbrush, damp cloth",s:["Vacuum loose dirt and dead bugs.","Scrub with a damp toothbrush.","Wipe dry."]});
C("h-vents","Whole house","Vacuum air vents & returns",90,15,{s:["Vacuum vent covers and cold-air return grilles with a brush tool.","Wash them in soapy water if they're greasy or dusty.","Check the HVAC filter while you're at it."],eco:"Cat hair builds up fast on returns."});
C("h-blinds","Whole house","Clean blinds & curtains",90,30,{s:["Close blinds and wipe each side with a damp microfiber cloth.","Vacuum curtains with a brush tool, or wash per the label."],w:"Make sure blind cords are tied up out of kids' reach."});
C("h-lamps","Whole house","Dust lampshades",90,10,{s:["Roll a lint roller over fabric shades.","Wipe bulbs once they're cool."]});
C("h-screens","Whole house","Wipe screens & electronics",30,10,{sup:"Dry microfiber, 70% isopropyl alcohol",s:["Turn screens off.","Wipe gently with a dry microfiber cloth.","For smudges, lightly dampen the cloth with water or alcohol."],w:"Never spray directly onto screens."});
C("h-closets","Whole house","Declutter & dust closets",365,60,{s:["Take everything out of one closet at a time.","Donate what doesn't fit or isn't used.","Vacuum the floor and dust shelves.","Check wool clothing for moth holes."]});

/* Bedrooms & kids */
C("r-sheets","Bedrooms & kids","Change sheets (4 beds)",7,30,{s:["Strip beds and wash sheets warm or hot.","Wash kids' sheets more often after sickness or accidents."]});
C("r-bedding","Bedrooms & kids","Wash pillows, duvets & comforters",180,20,{s:["Check care labels.","Wash two pillows at a time to balance the machine.","Dry thoroughly on low with dryer balls to keep fill fluffy."],w:"Not drying completely leads to mildew inside the fill."});
C("r-mattress","Bedrooms & kids","Vacuum & rotate mattress",180,20,{sup:"Vacuum upholstery tool, baking soda",s:["Strip the bed.","Sprinkle baking soda over the mattress and leave 1 hour.","Vacuum thoroughly.","Rotate head to foot."],eco:"Baking soda pulls odors without fragrance."});
C("r-toys","Bedrooms & kids","Wash & sanitize toys",30,20,{s:["Hard plastic toys: top rack of the dishwasher in a mesh bag, or soapy water.","Stuffed animals: in a pillowcase in the washer on gentle, then air dry.","Wipe electronic toys with a cloth dampened with alcohol."],eco:"Soap and water is enough for routine cleaning."});
C("r-carseat","Bedrooms & kids","Clean car seats & high chair",90,30,{s:["High chair: take the tray to the sink and scrub with hot soapy water. Wipe the frame and straps.","Car seat: vacuum crumbs. Remove the cover and wash it per the manual.","Spot-clean straps with a damp cloth and mild soap only."],w:"Never machine-wash or bleach car seat harness straps. It weakens the webbing. Follow the seat's manual."});

/* Cats */
C("c-scoop","Cats","Scoop litter boxes",1,5,{s:["Scoop clumps and waste.","Top up litter to 2–3 inches.","Sweep or vacuum scattered litter."],eco:"Daily scooping means fewer full litter changes."});
C("c-litter","Cats","Full litter change & wash box",21,20,{sup:"Unscented dish soap, hot water, scrub brush, fresh litter",s:["Dump all the litter.","Scrub the box with hot water and unscented dish soap. Rinse well.","Dry fully and refill with fresh litter."],eco:"Plain soap is enough. Cats dislike scented boxes.",w:"No ammonia (it smells like urine) and no essential oils or phenol cleaners. If pregnant, have someone else do it (toxoplasmosis)."});
C("c-fountain","Cats","Clean water fountain & bowls",14,15,{sup:"Small brush, replacement filter",s:["Take apart the fountain. Scrub the pump and tubes with a small brush.","Wash bowls on the top rack of the dishwasher or with hot soapy water.","Replace the filter if it's due and reassemble."],eco:"Slime builds up fast. Clean bowls keep cats drinking."});
C("c-beds","Cats","Wash cat beds & blankets",14,5,{s:["Shake hair outside first.","Wash hot with unscented detergent.","Clean the lint trap afterwards. Cat hair loads it up."]});
C("c-tree","Cats","Vacuum cat tree & scratchers",14,10,{s:["Vacuum carpeted perches and posts.","Check for loose platforms or worn-out scratchers."]});

/* Laundry */
C("l-washer","Laundry","Clean the washing machine (top load)",30,15,{sup:"Washer cleaner (Affresh) or 1 cup bleach, cloth, old toothbrush",s:["Run an empty hottest, largest cycle with a washer cleaner tablet or 1 cup bleach.","Optional: pause it after it fills and agitates for a minute. Let it soak an hour, then let it finish.","Wipe under the lid, the tub rim, and the agitator top with a damp cloth.","Pull out the fabric softener and bleach dispensers if they come out and scrub them.","Leave the lid open to dry out."],eco:"A cleaner tablet or a hot-water cycle with 2 cups vinegar works for light upkeep.",alt:"Bleach cycle for musty smells or visible mold.",w:"If you do both vinegar and bleach, run them as separate cycles with a rinse in between. Never mix them. Some top-loaders have a lint filter in the agitator or along the tub rim: check the manual."});
C("l-lint-screen","Laundry","Wash dryer lint screen",60,5,{sup:"Dish soap, soft brush",s:["Pull out the lint screen and clear the lint.","Scrub with warm soapy water and a soft brush to remove dryer-sheet film.","Test it: water should pass through. Let it dry fully before reinstalling."],eco:"Wool dryer balls replace dryer sheets and don't clog the screen.",w:"Clean the screen itself every load. Lint buildup is a fire risk."});
C("l-lint-housing","Laundry","Vacuum the lint trap housing",90,10,{sup:"Long dryer lint brush or vacuum crevice tool",s:["With the screen out, push a long lint brush down into the slot.","Twist and pull out lint.","Vacuum the slot with a narrow crevice attachment."],eco:"Clearing this deep lint shortens drying times."});
C("l-tub","Laundry","Scrub the laundry tub",30,10,{sup:"Baking soda, dish soap, scrub brush",s:["Rinse out debris.","Sprinkle baking soda and scrub the basin with a squirt of dish soap.","Scrub the faucet and drain. Rinse."],alt:"Oxygen bleach paste for stains, or Bar Keepers Friend on stainless.",w:"Don't leave cleaning water standing where little kids can reach it."});
C("l-behind","Laundry","Dust behind & on top of machines",90,15,{s:["Wipe the tops of washer and dryer.","Vacuum behind and around them, where lint and cat hair collect."]});


/* Whole house: tools */
C("v-vac","Whole house","Clean the vacuum: bin, filter & brush roll",30,15,{sup:"Scissors or seam ripper, soft brush",s:["Unplug or remove the battery.","Empty the bin and tap out the filter over the trash. Wash the filter only if the manual says it's washable, then dry 24 hours.","Cut cat hair and string off the brush roll with scissors or a seam ripper.","Wipe the bin and check the hose for clogs."],eco:"A clean filter and brush roll keep suction strong, so you vacuum less."});

/* Instruments */
C("i-dust","Instruments","Dust instruments & wipe keys",7,10,{sup:"Soft microfiber cloths, mild dish soap",s:["Dust cases and finishes with a dry microfiber cloth, following the grain.","Piano keys: wipe with a cloth barely damp with water and a drop of dish soap, front to back, then dry right away. Do sharps with a separate cloth.","Wipe strings and fingerboards on stringed instruments after playing.","Close the piano lid when not in use to keep dust off the keys."],eco:"A dry or barely damp microfiber cloth is all most finishes need.",w:"Never spray anything on an instrument. Avoid household furniture polish, silicone sprays and alcohol, which can damage lacquer, ivory and old finishes. Use a polish made for that instrument if you use one at all."});
C("i-humidity","Instruments","Check instrument humidity",7,2,{sup:"Hygrometer",s:["Read the hygrometer near the instruments.","Aim for 40–50% relative humidity.","In winter, run a humidifier or refill case humidifiers. In humid summers, run the AC or a dehumidifier.","Keep instruments away from heat vents, radiators, exterior doors and direct sun."],eco:"Steady humidity prevents cracked soundboards, sticking keys and pitch drift.",w:"Big swings matter more than the exact number. Avoid moving instruments between rooms with very different conditions."});
U("i-tune","Instruments","Piano tuning",180,0,{s:["Book a piano technician. Twice a year is typical, often spring and fall after the heating or cooling season changes.","Ask them to check the action and humidity while they're there."]});

/* ---------------- Store: db when the page runs in claude.ai, this device otherwise ---------------- */
var LS="hk-log-v1";
var COLS={state:"state",custom:"custom",spend:"spend",visits:"visits",apps:"appliances"};
var S={state:{},custom:{},spend:{},visits:{},apps:{},prefs:{},mode:"local",readonly:false};
function clone(v){return JSON.parse(JSON.stringify(v))}
function lsRead(){try{var v=JSON.parse(localStorage.getItem(LS)||"{}");Object.keys(COLS).forEach(function(k){S[k]=v[k]||{}});S.prefs=v.prefs||{}}catch(e){}}
function lsWrite(){try{var o={prefs:S.prefs};Object.keys(COLS).forEach(function(k){o[k]=S[k]});localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
var dbref=null,chains={};
function chain(key,fn){var p=(chains[key]||Promise.resolve()).then(fn,fn);chains[key]=p.catch(function(){});return p}
function writeErr(e){
  if(e&&e.code==="invalid_argument"){S.readonly=true;toast("You can view this list, but not change it.")}
  else if(e&&e.code==="quota_exceeded"){toast("Storage is full. Your latest change wasn’t saved.")}
  else toast("Couldn’t save that change. Check your connection and try again.");
}
function save(kind,id,quiet){
  var v=S[kind][id];lsWrite();if(!quiet)render();
  if(S.mode!=="db")return;
  chain(kind+":"+id,function(){var r=dbref.collection(COLS[kind]).doc(id);return v?r.set(clone(v)):r.delete()}).catch(writeErr);
}
function saveState(id){save("state",id)}
function savePrefs(){
  lsWrite();render();
  if(S.mode!=="db")return;
  chain("prefs",function(){return dbref.collection("meta").doc("prefs").set(clone(S.prefs))}).catch(writeErr);
}
function connect(){
  if(!window.claude||!window.claude.use){footer();return}
  window.claude.use("db").then(function(db){
    if(!db){footer();return}
    dbref=db;S.mode="db";footer();
    Object.keys(COLS).forEach(function(k){
      db.collection(COLS[k]).onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});S[k]=m;lsWrite();render()},function(){});
    });
    db.collection("meta").doc("prefs").onSnapshot(function(d){S.prefs=d.exists?Object.assign({},d.data()):{};lsWrite();render()},function(){});
  }).catch(function(){footer()});
}
function footer(){document.getElementById("foot").textContent=S.mode==="db"?"Saved to your account · syncs across your devices":"Saved in this browser only"}

function P(k,d){return S.prefs[k]!=null?S.prefs[k]:d}
function houseName(){return P("houseName","The Zhang-Wolfe House")}
function people(){return P("people",[])}
function cleanEvery(){return +P("cleanEvery",14)}
function cleanTasks(){return P("cleanTasks",CLEAN_DEFAULT)}
function rate(){return +P("rate",40)}
function me(){try{var m=localStorage.getItem("hk-me");if(m&&people().indexOf(m)>=0)return m}catch(e){}return people()[0]||""}
function setMe(n){try{localStorage.setItem("hk-me",n)}catch(e){}}

/* ---------------- Logic ---------------- */
var DAY=864e5;
function tasks(){var c=Object.keys(S.custom).map(function(k){var t=Object.assign({},S.custom[k]);t.id=k;t.custom=true;return t});return L.concat(c)}
function st(id){return S.state[id]||{}}
function every(t){return st(t.id).every||t.e}
function last(t){var h=st(t.id).hist||[];return h[0]||null}
function since(t){var a=last(t);return a?Math.max(0,Math.floor((Date.now()-new Date(a.at).getTime())/DAY)):null}
function until(t){var d=since(t);return d==null?null:every(t)-d}
function ratio(t){var d=since(t);return d==null?1:d/every(t)}
function aside(t){var s=st(t.id);if(s.why==="supplies")return "supplies";if(s.why==="later"&&s.until&&new Date(s.until).getTime()>Date.now())return "later";return null}
function hidden(t){return !!st(t.id).hidden}
function status(t){
  if(aside(t))return {cls:"st-aside",label:aside(t)==="supplies"?"Need supplies":"Later"};
  if(since(t)==null)return {cls:"st-new",label:"Not set up"};
  var r=ratio(t);
  if(r>=1)return {cls:"st-due",label:r>=2?"Overdue":"Due"};
  if(r>=.75)return {cls:"st-soon",label:"Soon"};
  return {cls:"st-ok",label:"Fresh"};
}
function fmtEvery(n){if(n===1)return "daily";if(n%365===0)return n===365?"yearly":"every "+(n/365)+" yrs";if(n%30===0&&n>=60)return "every "+(n/30)+" mo";if(n===30)return "monthly";if(n%7===0)return n===7?"weekly":"every "+(n/7)+" wks";return "every "+n+" days"}
function fmtAgo(d){if(d==null)return "not set up yet";if(d===0)return "today";if(d===1)return "yesterday";if(d<14)return d+" days ago";if(d<60)return Math.round(d/7)+" wks ago";if(d<730)return Math.round(d/30)+" mo ago";return Math.round(d/365)+" yrs ago"}
function fmtDate(iso){return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function fmtShort(d){return new Date(d).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function fmtMin(m){m=Math.round(m);if(m<60)return m+" min";var h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+r+" min":"")}
function fmtHrs(m){return m<60?Math.round(m)+" min":(Math.round(m/6)/10)+" hrs"}
function money(n){var r=Math.round(n);return (r<0?"−$":"$")+Math.abs(r).toLocaleString()}
function isoDay(d){var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)}
function tier(t){var e=every(t);return e<=14?"Routine":e<=90?"Periodic":"Deep clean"}
function active(list){return tasks().filter(function(t){return (!list||t.list===list)&&!hidden(t)})}
function byDue(a,b){return ratio(b)-ratio(a)||every(a)-every(b)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function findTask(id){return tasks().filter(function(t){return t.id===id})[0]}
function appsFor(t){return Object.keys(S.apps).filter(function(k){var a=S.apps[k];return t.app===k||(KINDS[a.kind]||KINDS.other).tasks.indexOf(t.id)>=0})}
function appTasks(id){var a=S.apps[id];if(!a)return [];var ids=(KINDS[a.kind]||KINDS.other).tasks;return tasks().filter(function(t){return ids.indexOf(t.id)>=0||t.app===id})}

function markDone(id,note,atIso,x){
  var s=Object.assign({},st(id));var h=(s.hist||[]).slice();
  var e=Object.assign({at:atIso||new Date().toISOString(),note:note||""},x||{});
  if(e.by==null&&people().length&&!e.est)e.by=me();
  if(!e.by)delete e.by;
  h.push(e);h.sort(function(a,b){return new Date(b.at)-new Date(a.at)});
  s.hist=h.slice(0,60);delete s.why;delete s.until;S.state[id]=s;saveState(id);
}
function setAside(id,why,days){var s=Object.assign({},st(id));s.why=why;if(days)s.until=new Date(Date.now()+days*DAY).toISOString();else delete s.until;S.state[id]=s;saveState(id)}
function clearAside(id){var s=Object.assign({},st(id));delete s.why;delete s.until;S.state[id]=s;saveState(id)}
function patch(id,obj){var s=Object.assign({},st(id),obj);Object.keys(obj).forEach(function(k){if(obj[k]==null||obj[k]==="")delete s[k]});S.state[id]=s;saveState(id)}

/* Cleaners' visits: each visit also logs the tasks they did, marked by "Cleaners" */
function visits(){return Object.keys(S.visits).map(function(k){return Object.assign({id:k},S.visits[k])}).sort(function(a,b){return new Date(b.at)-new Date(a.at)})}
function logVisit(at,cost,note,ids){
  var vid="v"+Date.now().toString(36);
  S.visits[vid]={at:at,cost:cost||0,note:note||"",tasks:ids};save("visits",vid,true);
  ids.forEach(function(id){
    var s=Object.assign({},st(id)),h=(s.hist||[]).slice();
    h.push({at:at,note:"",by:"Cleaners",visit:vid});h.sort(function(a,b){return new Date(b.at)-new Date(a.at)});
    s.hist=h.slice(0,60);S.state[id]=s;save("state",id,true);
  });
  render();return vid;
}
function removeVisit(vid){
  var v=S.visits[vid];if(!v)return;
  (v.tasks||[]).forEach(function(id){var s=Object.assign({},st(id));s.hist=(s.hist||[]).filter(function(h){return h.visit!==vid});S.state[id]=s;save("state",id,true)});
  delete S.visits[vid];save("visits",vid);
}

/* Week math. Value of doing it yourself = flat pro price where one is typical, else minutes × cleaner's hourly rate.
   0-minute tasks are ones you hire out, and the cleaners' work is theirs, so neither adds savings. */
var PRO={"m-dryer-vent":150,"m-gutters":175,"h-windows":250,"m-water-heater":125,"e-gasket":80,"p-filter":75,"m-hvac":40,"m-fridge-filter":40};
function proValue(t,min){if(PRO[t.id]!=null)return PRO[t.id];if(!t.m)return 0;return min/60*rate()}
function weekStart(off){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+off*7);return d}
function weekData(off){
  var s=weekStart(off),e=new Date(s);e.setDate(e.getDate()+7);
  var items=[],buys=[],vis=[];
  tasks().forEach(function(t){(st(t.id).hist||[]).forEach(function(h){var at=new Date(h.at);
    if(at>=s&&at<e&&!h.est&&h.by!=="Cleaners"){var min=h.min!=null?+h.min:(t.m||0);items.push({t:t,h:h,at:at,min:min,cost:+h.cost||0,pro:proValue(t,min)})}})});
  Object.keys(S.spend).forEach(function(k){var b=S.spend[k],at=new Date(b.at);if(at>=s&&at<e)buys.push({id:k,at:at,what:b.what,amt:+b.amt||0})});
  visits().forEach(function(v){var at=new Date(v.at);if(at>=s&&at<e)vis.push(v)});
  items.sort(function(a,b){return a.at-b.at});buys.sort(function(a,b){return a.at-b.at});
  var sum=function(a,f){return a.reduce(function(n,x){return n+f(x)},0)};
  var min=sum(items,function(x){return x.min}),spent=sum(items,function(x){return x.cost})+sum(buys,function(x){return x.amt}),pro=sum(items,function(x){return x.pro});
  return {s:s,e:e,items:items,buys:buys,vis:vis,min:min,spent:spent,pro:pro,saved:pro-spent,cleanCost:sum(vis,function(v){return +v.cost||0})};
}
function delta(a,b,f){var d=a-b;if(!b&&!a)return "";return (d>0?"+":d<0?"−":"±")+f(Math.abs(d))+" vs last week"}

var TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function row(t){
  var s=status(t),d=since(t),pct=Math.min(100,Math.round(ratio(t)*100)),l=last(t);
  var meta=esc(t.area)+" · "+fmtAgo(d)+(l&&l.by?" by "+esc(l.by):"")+" · "+fmtEvery(every(t))+(t.m?" · ~"+t.m+" min":"");
  if(aside(t)==="later")meta=esc(t.area)+" · back "+fmtShort(st(t.id).until);
  return '<li class="row '+s.cls+'" data-id="'+esc(t.id)+'">'+
    '<button class="tick" data-act="quick" aria-label="Mark '+esc(t.name)+' done">'+TICK+'</button>'+
    '<button class="main" data-act="open"><span class="name">'+esc(t.name)+'</span><span class="meta">'+meta+'</span></button>'+
    '<span class="pill">'+s.label+'</span>'+
    (d!=null&&!aside(t)?'<span class="meter" style="width:'+pct+'%"></span>':'')+'</li>';

var cur=null,stack=[],lastFocus=null;

function renderSheet(){
  var el=document.getElementById("sheet"),m=cur.mode,out;
  if(m==="task")out=taskSheet();else if(m==="add")out=addSheet();else if(m==="app")out=appSheet();else if(m==="visit")out=visitSheet();else out=settingsSheet();
  if(out==null){back();return}
  el.innerHTML='<div class="sheet-in">'+out+'</div>';el.hidden=false;
}
function openSheet(mode,id,extra){
  if(!cur)lastFocus=document.activeElement;else stack.push(cur);

function back(){if(stack.length){cur=stack.pop();renderSheet();document.getElementById("sheet").scrollTop=0}else closeSheet()}

/* ---------------- Toast ---------------- */
var toastTimer;
function toast(msg,undo){
  var el=document.getElementById("toast");el.innerHTML="";var sp=document.createElement("span");sp.textContent=msg;el.appendChild(sp);
  if(undo){var b=document.createElement("button");b.textContent="Undo";b.onclick=function(){undo();el.hidden=true};el.appendChild(b)}
  el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},5000);
}
function copyText(text,okMsg){
  var fall=function(){var io=document.getElementById("io")||document.querySelector(".sheet-in");var ta=document.createElement("textarea");ta.readOnly=true;ta.value=text;io.appendChild(ta);ta.select();toast("Select all and copy")};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){toast(okMsg)},fall);else fall();
}

function guard(){if(S.readonly){toast("You can view this list, but not change it.");return false}return true}
function newApp(kind,name){
  var id="a"+Date.now().toString(36);S.apps[id]={kind:kind,name:name||KINDS[kind].label};save("apps",id);return id;

document.addEventListener("click",function(e){
  var tab=e.target.closest("nav.tabs button");
  if(tab){ui.tab=tab.dataset.tab;rememberUi();render();window.scrollTo(0,0);return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act,r=b.closest(".row"),id=r&&r.dataset.id?r.dataset.id:cur&&cur.id;
  switch(act){
    case "open":openSheet("task",id);break;
    case "openapp":openSheet("app",b.dataset.app||(r&&r.dataset.app));break;
    case "back":back();break;
    case "settings":openSheet("settings");break;
    case "visit":openSheet("visit");break;
    case "quick":{if(!guard())return;var t=findTask(id),prev=S.state[id]?clone(S.state[id]):undefined;markDone(id);toast("Done: "+t.name,function(){S.state[id]=prev;saveState(id)});break}
    case "budget":ui.budget=b.dataset.v?+b.dataset.v:null;render();break;
    case "range":ui.range=b.dataset.v;rememberUi();render();break;
    case "area":ui.area=b.dataset.v;render();break;
    case "uparea":ui.upArea=b.dataset.v;render();break;
    case "tab":ui.tab=b.dataset.v;rememberUi();render();window.scrollTo(0,0);break;
    case "wk":ui.weekOff=Math.min(0,ui.weekOff+(+b.dataset.v));render();break;
    case "who":setMe(b.dataset.v);b.parentNode.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c===b))});break;
    case "done":{if(!guard())return;var n=document.getElementById("note").value.trim(),t2=findTask(id),x={},
      dm=document.getElementById("dmin").value,dc=parseFloat(document.getElementById("dcost").value);
      if(dm!==""&&+dm!==(t2.m||0))x.min=Math.max(0,Math.round(+dm));if(dc>0)x.cost=Math.round(dc*100)/100;
      markDone(id,n,null,x);back();toast("Done: "+t2.name);break}
    case "later":if(!guard())return;setAside(id,"later",+b.dataset.v);back();toast("Set aside");break;
    case "supplies":if(!guard())return;setAside(id,"supplies");back();toast("Added to the shopping list on To do");break;
    case "unaside":if(!guard())return;clearAside(id);break;
    case "ago":if(!guard())return;markDone(id,"",new Date(Date.now()-(+b.dataset.v)*DAY).toISOString(),+b.dataset.v?{est:true}:null);break;
    case "logpast":{if(!guard())return;var v=document.getElementById("pastdate").value;if(!v){toast("Pick a date first.");return}markDone(id,"",new Date(v+"T12:00:00").toISOString());break}
    case "delhist":{if(!guard())return;var s=Object.assign({},st(id)),h=(s.hist||[]).slice();h.splice(+b.dataset.v,1);s.hist=h;S.state[id]=s;saveState(id);break}
    case "savenotes":if(!guard())return;patch(id,{notes:document.getElementById("hnote").value.trim()});toast("Notes saved");break;
    case "hide":if(!guard())return;patch(id,{hidden:true});toast("Hidden. Find it at the bottom of the list.");break;
    case "unhide":if(!guard())return;patch(id,{hidden:null});break;
    case "delcustom":if(!guard())return;delete S.custom[id];delete S.state[id];save("state",id,true);save("custom",id,true);back();toast("Task deleted");break;
    case "add":openSheet("add",null,{list:b.dataset.list});break;
    case "addcare":openSheet("add",null,{list:"upkeep",app:cur.id});break;
    case "quickapp":{if(!guard())return;var aid=newApp(b.dataset.kind,b.dataset.name);openSheet("app",aid);break}
    case "newapp":{if(!guard())return;openSheet("app",newApp("other","New appliance"));break}
    case "delapp":{if(!guard())return;if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tap again to remove";return}
      var gone=cur.id;Object.keys(S.custom).forEach(function(k){if(S.custom[k].app===gone){var c=Object.assign({},S.custom[k]);delete c.app;S.custom[k]=c;save("custom",k,true)}});
      delete S.apps[gone];save("apps",gone);back();toast("Appliance removed");break}
    case "delvisit":{if(!guard())return;if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tap again";return}removeVisit(b.dataset.v);toast("Visit removed");break}
    case "copynotes":copyText(P("cleanNotes",""),"Copied. Paste it into a text to the cleaners.");break;
    case "delbuy":if(!guard())return;delete S.spend[b.dataset.v];save("spend",b.dataset.v);break;
    case "export":copyText(JSON.stringify({state:S.state,custom:S.custom,spend:S.spend,visits:S.visits,apps:S.apps,prefs:S.prefs}),"Backup copied. Paste it into a note to keep it.");break;
    case "import":document.getElementById("io").innerHTML='<label class="lbl" for="iotext">Paste your backup</label><textarea id="iotext"></textarea><div class="btnrow"><button class="btn small primary" data-act="doimport">Restore</button></div>';break;
    case "doimport":{if(!guard())return;try{var d=JSON.parse(document.getElementById("iotext").value);if(!d||typeof d.state!=="object")throw 0;
      Object.keys(COLS).forEach(function(kk){Object.keys(d[kk]||{}).forEach(function(i){S[kk][i]=d[kk][i];save(kk,i,true)})});
      if(d.prefs){S.prefs=Object.assign({},S.prefs,d.prefs);savePrefs()}render();toast("Backup restored")}catch(x){toast("That doesn’t look like a backup from this app.")}break}
  }
});
document.addEventListener("change",function(e){if(e.target.id==="every"&&cur&&cur.mode==="task"){if(!guard())return;var t=findTask(cur.id),n=+e.target.value;patch(cur.id,{every:n===t.e?null:n})}});
document.addEventListener("input",function(e){if(e.target.id==="q"){ui.q=e.target.value;render()}});
function val(id){var x=document.getElementById(id);return x?x.value.trim():""}
document.addEventListener("submit",function(e){
  var f=e.target.id;if(["buyform","addform","appform","visitform","setform"].indexOf(f)<0)return;
  e.preventDefault();if(!guard())return;
  if(f==="buyform"){
    var a=parseFloat(val("b-amt"));if(!(a>0)){toast("Enter how much it cost.");return}
    var bid="b"+Date.now().toString(36),dt=val("b-date");
    S.spend[bid]={what:val("b-what"),amt:Math.round(a*100)/100,at:(dt?new Date(dt+"T12:00:00"):new Date()).toISOString()};
    document.getElementById("b-what").value="";document.getElementById("b-amt").value="";save("spend",bid);toast("Purchase added");
  }else if(f==="addform"){
    var name=val("a-name");if(!name)return;
    var id="u"+Date.now().toString(36);
    S.custom[id]={list:cur.extra.list||"clean",name:name,area:val("a-area")||"Other",e:+val("a-every"),m:+val("a-min")||0,sup:val("a-sup"),
      s:document.getElementById("a-steps").value.split("\n").map(function(x){return x.trim()}).filter(Boolean)};
    if(cur.extra.app)S.custom[id].app=cur.extra.app;
    save("custom",id);cur={mode:"task",id:id,extra:{}};renderSheet();toast("Task added");
  }else if(f==="appform"){
    var a2=Object.assign({},S.apps[cur.id]);
    [["name","ap-name"],["kind","ap-kind"],["location","ap-loc"],["brand","ap-brand"],["model","ap-model"],["serial","ap-serial"],["bought","ap-bought"],["warranty","ap-war"],["notes","ap-notes"]].forEach(function(p){var v=val(p[1]);if(v)a2[p[0]]=v;else delete a2[p[0]]});
    var man=val("ap-man");if(man&&!/^https?:\/\//i.test(man))man="https://"+man;if(man)a2.manual=man;else delete a2.manual;
    S.apps[cur.id]=a2;save("apps",cur.id);toast("Saved");document.getElementById("sheet").scrollTop=0;
  }else if(f==="visitform"){
    var ids=[].map.call(document.querySelectorAll("#visitform input[data-task]:checked"),function(x){return x.dataset.task});
    if(!ids.length){toast("Check at least one task they did.");return}
    var vd=val("v-date"),at=vd===isoDay(new Date())?new Date().toISOString():new Date(vd+"T12:00:00").toISOString();
    if(document.getElementById("v-remember").checked)S.prefs=Object.assign({},S.prefs,{cleanTasks:ids});
    var cost=parseFloat(val("v-cost"));if(cost>0&&!P("cleanCost",0))S.prefs=Object.assign({},S.prefs,{cleanCost:cost});
    logVisit(at,cost>0?cost:0,val("v-note"),ids);savePrefs();closeSheet();toast("Visit logged · "+ids.length+" tasks marked done");
  }else if(f==="setform"){
    var np=Object.assign({},S.prefs);
    np.houseName=val("s-name")||"The Zhang-Wolfe House";
    np.people=val("s-people").split(",").map(function(x){return x.trim()}).filter(Boolean);
    np.cleanEvery=+val("s-every");var cc=parseFloat(val("s-ccost"));if(cc>=0)np.cleanCost=cc;else delete np.cleanCost;
    np.cleanNotes=document.getElementById("s-cnotes").value.trim();var rt=parseFloat(val("s-rate"));if(rt>=0)np.rate=rt;
    S.prefs=np;savePrefs();closeSheet();toast("Saved");
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&cur)back()});

lsRead();footer();render();connect();
</script>
