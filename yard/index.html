<title>Yard &amp; Irrigation Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: a site plan on a phone. Masthead, then a big pan-and-zoom plan sheet with a drafting toolbar;
   zones, care and log are lists under the same tab bar. Bottom sheets edit whatever is selected.
   Palette: sage paper and graphite ink for the plan, hose-green for actions, water-blue for pressure lines. */
:root{
  --bg:#eef1ec; --surface:#ffffff; --surface-2:#e2e7df; --ink:#1b2420; --muted:#5b665f; --line:#d2d9d0;
  --accent:#23664a; --accent-ink:#ffffff; --accent-soft:#d9eadf;
  --water:#1f63b5; --water-soft:#dbe7f7; --soil:#8a6a43; --leaf:#3f8a3a; --hard:#a7a39a; --house:#c9c5bb;
  --paper:#f7f8f3; --grid:#e3e8de;
  --ok:#2c7349; --ok-soft:#dcefe2; --warn:#94600f; --warn-soft:#f6e8cc; --due:#a63d33; --due-soft:#f6dcd8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#19211d; --surface-2:#232d28; --ink:#e4ebe6; --muted:#9aa89f; --line:#2c3832;
  --accent:#6fcf9c; --accent-ink:#0b2418; --accent-soft:#1d3429;
  --water:#7fb2f2; --water-soft:#1b2a3d; --soil:#c9a173; --leaf:#7cc874; --hard:#6c6a64; --house:#4a4842;
  --paper:#151c18; --grid:#1f2924;
  --ok:#79c99a; --ok-soft:#1b3125; --warn:#e2b257; --warn-soft:#3a2f17; --due:#f08a7d; --due-soft:#3d2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211d; --surface-2:#232d28; --ink:#e4ebe6; --muted:#9aa89f; --line:#2c3832;
  --accent:#6fcf9c; --accent-ink:#0b2418; --accent-soft:#1d3429;
  --water:#7fb2f2; --water-soft:#1b2a3d; --soil:#c9a173; --leaf:#7cc874; --hard:#6c6a64; --house:#4a4842;
  --paper:#151c18; --grid:#1f2924;
  --ok:#79c99a; --ok-soft:#1b3125; --warn:#e2b257; --warn-soft:#3a2f17; --due:#f08a7d; --due-soft:#3d2220; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 20px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* masthead */
.mast{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding-block:16px 12px}
.badge{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.badge svg{width:26px;height:26px}
.mast h1{font-size:1.7rem;text-transform:uppercase;letter-spacing:.03em}
.mast .sub{margin:0;color:var(--muted);font-size:.82rem}
.iconbtn{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:focus-visible{outline:3px solid var(--accent)}
.iconbtn svg{width:22px;height:22px}
.view{display:flex;flex-direction:column;gap:18px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sech h2{font-size:1.55rem;text-transform:uppercase;letter-spacing:.03em}
.sech .aside{color:var(--muted);font-size:.85rem}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:40px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--due);border-color:var(--due-soft)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.88rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.chip .sw{width:10px;height:10px;border-radius:50%;flex:none}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.empty strong{color:var(--ink)}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
/* map */
.tools{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.tools button{all:unset;cursor:pointer;text-align:center;padding:7px 2px 6px;border-radius:9px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.tools button svg{width:20px;height:20px}
.tools button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.tools button:focus-visible{outline:3px solid var(--accent)}
.ctx{display:flex;flex-direction:column;gap:8px;min-height:34px}
.ctx .hint{margin:0;color:var(--muted);font-size:.86rem}
.ctx .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctx .readout{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.ctx input[type=number]{width:90px}
.mapbox{position:relative;height:clamp(360px,62dvh,860px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper)}
#plan{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-size:1.2rem;font-weight:700}
.mapctl svg{width:20px;height:20px}
.scalebar{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:8px;padding:4px 8px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.scalebar i{display:block;height:5px;border:1.5px solid var(--ink);border-top:0}
.zonefilter{position:absolute;left:10px;top:10px;max-width:calc(100% - 70px)}
.zonefilter select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;min-height:40px;max-width:100%}
.layers{display:flex;gap:6px;flex-wrap:wrap}
/* plan symbols */
#plan text{font-family:var(--f-display);font-weight:600;pointer-events:none}
.ar-lawn{fill:var(--leaf);fill-opacity:.16;stroke:var(--leaf);stroke-opacity:.5}
.ar-bed{fill:var(--soil);fill-opacity:.18;stroke:var(--soil);stroke-opacity:.6}
.ar-hard{fill:var(--hard);fill-opacity:.3;stroke:var(--hard)}
.ar-house{fill:var(--house);fill-opacity:.7;stroke:var(--muted)}
.ar-other{fill:var(--water);fill-opacity:.08;stroke:var(--water);stroke-opacity:.5;stroke-dasharray:4 3}
.lbl{fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
.cov{fill-opacity:.12;stroke-opacity:.45}
.tree{fill:var(--leaf);fill-opacity:.15;stroke:var(--leaf)}
.plant{fill:var(--leaf);stroke:var(--paper)}
.ink{fill:var(--surface);stroke:var(--ink)}
.inkf{fill:var(--ink)}
.dim{opacity:.18}
.selring{fill:none;stroke:var(--accent);stroke-dasharray:3 2}
.hdl{fill:var(--surface);stroke:var(--accent)}
.hdl.mid{fill:var(--accent);fill-opacity:.4;stroke:none}
.draft{fill:none;stroke:var(--accent);stroke-dasharray:6 4}
.meas{stroke:var(--due);fill:var(--due)}
/* lists */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;align-items:center;gap:10px}
.zn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:1.2rem;font-weight:700;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.card h3{font-size:1.2rem}
.card .meta{color:var(--muted);font-size:.84rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0}
.stats div{background:var(--surface-2);border-radius:8px;padding:6px 8px;min-width:0}
.stats dt{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.stats dd{margin:0;font-family:var(--f-display);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.days{display:flex;gap:3px}
.days span{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.7rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.days span.on{background:var(--water);color:var(--surface)}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
ul.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
ul.rows li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
ul.rows li:first-child{border-top:0}
ul.rows li .t{min-width:0}
ul.rows li .t b{display:block;font-weight:600}
ul.rows li .t small{color:var(--muted);display:block;font-size:.82rem}
.pill{font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st-due{background:var(--due-soft);color:var(--due)}
.st-soon{background:var(--warn-soft);color:var(--warn)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-new{background:var(--surface-2);color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tally b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.tally span{color:var(--muted);font-size:.82rem}
.mon{margin:6px 0 4px}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
nav.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
/* sheet */
.scrim{position:fixed;inset:0 0 calc(var(--tabh) + env(safe-area-inset-bottom,0px));background:rgba(10,16,13,.38);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:31;display:flex;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet .panel{width:100%;max-width:640px;max-height:min(calc(100dvh - var(--tabh) - 40px),760px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);padding:14px 16px 18px}
.sheet.peek .panel{max-height:min(42dvh,480px)}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:-14px;background:var(--surface);padding-block:6px;z-index:1}
.sheet .hd h2{font-size:1.4rem;flex:1;min-width:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{font-weight:400;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;width:100%}
.form textarea{min-height:70px;resize:vertical}
.form .ro{font-family:var(--f-display);font-size:1.25rem;color:var(--ink);font-weight:600}
.sheet .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px)}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:24px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
@media (max-width:420px){.form{grid-template-columns:1fr}.tools button{font-size:.7rem}}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="mast">
    <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v6M12 9c-3 0-5 2-5 5M12 9c3 0 5 2 5 5M7 14v3M17 14v3M12 9v12"/><circle cx="7" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></div>

    <button class="iconbtn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <main>
    <section class="view" id="v-map" aria-label="Map">
      <div class="tools" role="group" aria-label="Drawing tool" id="tools"></div>

        <div class="zonefilter"><select id="zoneFilter" aria-label="Highlight a zone"></select></div>
        <div class="mapctl">
          <button id="zin" aria-label="Zoom in">+</button>
          <button id="zout" aria-label="Zoom out">−</button>
          <button id="zfit" aria-label="Fit plan to screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
        <div class="scalebar" id="scalebar"></div>
      </div>
      <div>
        <p class="eyebrow" style="margin-bottom:6px">Show on plan</p>
        <div class="layers" id="layers"></div>
      </div>
      <div id="mapEmpty"></div>
    </section>

    <section class="view" id="v-zones" aria-label="Zones" hidden></section>
    <section class="view" id="v-care" aria-label="Care" hidden></section>
    <section class="view" id="v-log" aria-label="Log" hidden></section>
  </main>
  <footer id="foot">Saved in this browser only</footer>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>

  <button data-tab="care"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M8 14l3 3 5-6"/></svg>Care</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg>Log</button>
</div></nav>

<script>
/* ---------------- Catalog ---------------- */
var PIPE={main:{label:"Mainline",w:4},lateral:{label:"Lateral",w:2.5},drip:{label:"Drip / poly",w:2},wire:{label:"Valve wire",w:1.2},sleeve:{label:"Sleeve",w:5}};

  poc:{label:"Water source",g:"equip"},hosebib:{label:"Hose bib",g:"equip"},box:{label:"Valve box",g:"equip"},sensor:{label:"Rain sensor",g:"equip"},drain:{label:"Drain",g:"equip"},

};

var ZCOL=["#2f7dd1","#d9822b","#2e9e6b","#b04fb3","#c7433b","#1d9aa8","#8a6d1f","#5b5fc7","#d1569a","#6b8e23","#7a5230","#4d7f99"];

var MATS=["PVC Sch 40","PVC Class 200","PVC Class 315","Poly (PE)","Drip line","Funny pipe","PEX","Copper","Galvanized","Wire 18 ga","Other"];
var LOGK={repair:"Repair",install:"Install",adjust:"Adjust",inspect:"Inspect",planting:"Planting",other:"Other"};
var CARE=[
  {id:"c-startup",n:"Spring start-up: open supply, run every zone",e:365,m:60,w:"Look for broken, sunk or tilted heads and wet spots."},

/* snapping: equipment, vertices, then pipe segments */
function snap(p,exceptId){
  var k=M.vb.s,best=null,bd=14*k;
  items().forEach(function(it){
    if(it.id===exceptId)return;
    var cand=it.t==="pt"?[[it.x,it.y]]:(it.pts||[]);
    cand.forEach(function(c){var d=dist(p,c);if(d<bd){bd=d;best=[c[0],c[1]]}});
  });
  if(M.draft)M.draft.forEach(function(c){var d=dist(p,c);if(d<bd){bd=d;best=[c[0],c[1]]}});
  if(best)return best;
  bd=10*k;
  items().forEach(function(it){
    if(it.t!=="pipe"||it.id===exceptId)return;
    for(var i=1;i<it.pts.length;i++){var a=it.pts[i-1],b=it.pts[i],dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;if(!L)continue;

    });
  }
  /* selection */

        var j=(i+1)%n;if(j!==0||closed){var a=sel.pts[i],b=sel.pts[j];h.push('<circle data-mid="'+i+'" cx="'+((a[0]+b[0])/2)+'" cy="'+((a[1]+b[1])/2)+'" r="'+(5*k)+'" class="hdl mid"/>')}
      }

    }
  }
  /* draft */
  if(M.draft&&M.draft.length){
    var dp=M.draft.slice();if(M.hover)dp.push(M.hover);
    h.push('<path d="'+pathD(dp,M.tool==="area"&&M.draft.length>2&&!M.hover)+'" class="draft" stroke-width="'+(2.5*k)+'"/>');
    M.draft.forEach(function(p,i){h.push('<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+((i===0&&M.tool==="area"?7:4.5)*k)+'" fill="var(--accent)" stroke="var(--paper)" stroke-width="'+k+'"/>')});
  }
  /* measure */
  if(M.tool==="measure"&&M.meas.length){
    var mp=M.meas.slice();if(mp.length===1&&M.hover)mp.push(M.hover);
    h.push('<path d="'+pathD(mp)+'" class="meas" fill="none" stroke-width="'+(2*k)+'"/>');
    mp.forEach(function(p){h.push('<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(4*k)+'" class="meas"/>')});
  }
  svg.innerHTML=h.join("");
  /* scale bar */
  var ftPerPx=k*fpu(),nice=[1,2,5,10,20,25,50,100,200,500,1000],want=90*ftPerPx,ft=nice[0];
  nice.forEach(function(n){if(n<=want)ft=n});
  $("scalebar").innerHTML='<i style="width:'+Math.round(ft/ftPerPx)+'px"></i><span class="num">'+ft+' ft</span>';
}

/* ---------------- Map: pointer input ---------------- */
var ptrs={},gest=null;
svg.addEventListener("pointerdown",function(e){
  if(!M.vb)return;
  try{svg.setPointerCapture(e.pointerId)}catch(x){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===2){
    var a=ptrs[ids[0]],b=ptrs[ids[1]];
    gest={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y),s0:M.vb.s,w0:toWorld((a.x+b.x)/2,(a.y+b.y)/2)};return;
  }
  var hd=e.target.closest("[data-h]"),mid=e.target.closest("[data-mid]"),itg=e.target.closest("[data-id]");
  gest={type:"one",sx:e.clientX,sy:e.clientY,moved:false,vb0:{x:M.vb.x,y:M.vb.y},item:itg?itg.getAttribute("data-id"):null,pid:e.pointerId};
  if(M.tool==="select"&&M.sel&&!M.draft){
    if(hd)gest.drag={idx:+hd.getAttribute("data-h")};
    else if(mid)gest.drag={mid:+mid.getAttribute("data-mid")};
  }
});
svg.addEventListener("pointermove",function(e){
  if(ptrs[e.pointerId])ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(!gest){
    if(e.pointerType==="mouse"&&M.vb&&((M.draft&&M.draft.length)||(M.tool==="measure"&&M.meas.length===1))){M.hover=snap(toWorld(e.clientX,e.clientY));drawMap()}
    return;
  }
  if(gest.type==="pinch"){
    var ids=Object.keys(ptrs);if(ids.length<2)return;var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(!d)return;
    var s=svgSize(),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;M.vb.s=Math.min(Math.max(gest.s0*gest.d0/d,0.02),50);
    M.vb.x=gest.w0[0]-(mx-s.l)*M.vb.s;M.vb.y=gest.w0[1]-(my-s.t)*M.vb.s;drawMap();return;
  }
  if(e.pointerId!==gest.pid)return;
  var dx=e.clientX-gest.sx,dy=e.clientY-gest.sy;
  if(!gest.moved&&Math.hypot(dx,dy)>6)gest.moved=true;
  if(!gest.moved)return;
  if(gest.drag){
    var it=S.items[M.sel];if(!it)return;var p=snap(toWorld(e.clientX,e.clientY),M.sel);
    if(gest.drag.mid!=null){it.pts.splice(gest.drag.mid+1,0,p);gest.drag={idx:gest.drag.mid+1}}
    else if(gest.drag.idx===-1){it.x=p[0];it.y=p[1]}
    else it.pts[gest.drag.idx]=p;
    gest.dirty=true;drawMap();return;
  }
  M.vb.x=gest.vb0.x-dx*M.vb.s;M.vb.y=gest.vb0.y-dy*M.vb.s;drawMap();
});
function endPtr(e){
  delete ptrs[e.pointerId];
  if(!gest)return;
  if(gest.type==="pinch"){if(!Object.keys(ptrs).length)gest=null;return}
  if(e.pointerId!==gest.pid)return;
  var g=gest;gest=null;
  if(g.drag&&g.dirty){save("items",M.sel,true);drawMap();if(sheetFor===M.sel)openItem(M.sel);return}
  if(!g.moved&&e.type==="pointerup")tap(toWorld(e.clientX,e.clientY),g.item);
}
svg.addEventListener("pointerup",endPtr);
svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("pointerleave",function(e){if(e.pointerType==="mouse"&&M.hover){M.hover=null;drawMap()}});
svg.addEventListener("wheel",function(e){e.preventDefault();zoomAt(Math.exp(e.deltaY*0.0015),e.clientX,e.clientY)},{passive:false});
svg.addEventListener("dblclick",function(e){if(M.draft&&M.draft.length>1){e.preventDefault();finishDraft()}});

function tap(p,itemId){
  if(M.tool==="select"){
    if(itemId){M.sel=itemId;drawMap();openItem(itemId)}
    else{M.sel=null;closeSheet();drawMap()}
    return;
  }
  var q=snap(p);
  if(M.tool==="point"){
    var id=uid(),it={t:"pt",k:M.ptK,x:q[0],y:q[1]};
    if(M.zone&&POINT[M.ptK].g!=="plant")it.z=M.zone;
    S.items[id]=it;M.sel=id;save("items",id,true);drawMap();openItem(id);renderCtx();return;
  }
  if(M.tool==="pipe"||M.tool==="area"){
    if(!M.draft)M.draft=[];
    if(M.tool==="area"&&M.draft.length>2&&dist(q,M.draft[0])<14*M.vb.s){finishDraft();return}
    var lastP=M.draft[M.draft.length-1];
    if(lastP&&dist(lastP,q)<3*M.vb.s&&M.draft.length>1){finishDraft();return}
    M.draft.push(q);drawMap();renderCtx();return;
  }
  if(M.tool==="measure"){
    if(M.meas.length>=2)M.meas=[];
    M.meas.push(q);M.hover=null;drawMap();renderCtx();
  }
}
function finishDraft(){
  var need=M.tool==="area"?3:2;
  if(!M.draft||M.draft.length<need){toast(M.tool==="area"?"An area needs at least 3 corners.":"A pipe needs at least 2 points.");return}
  var id=M.draftId||uid(),it=M.draftId?S.items[id]:{t:M.tool==="area"?"area":"pipe",k:M.tool==="area"?M.areaK:M.pipeK};
  it.pts=M.draft;
  if(!M.draftId&&M.zone&&it.t==="pipe"&&(it.k==="lateral"||it.k==="drip"))it.z=M.zone;
  if(!M.draftId&&it.t==="pipe"){var pr=S.prefs.lastPipe&&S.prefs.lastPipe[it.k];if(pr){it.size=pr.size;it.mat=pr.mat}}
  S.items[id]=it;M.draft=null;M.draftId=null;M.hover=null;M.sel=id;
  if(M.extending){M.extending=false;M.tool="select";renderTools()}
  save("items",id,true);drawMap();renderCtx();openItem(id);
}
function cancelDraft(){M.draft=null;M.hover=null;if(M.extending){M.extending=false;M.draftId=null;M.tool="select";renderTools()}M.draftId=null;drawMap();renderCtx()}

    function done(bg){S.prefs.bg=bg;S.prefs.fpu=keep;savePrefs();closeSheet();go("map");setTimeout(fit,0);toast("Image added. Now measure something you know to set the scale.")}

    else{try{var c=document.createElement("canvas"),s2=Math.min(1,1600/Math.max(w,h));c.width=Math.round(w*s2);c.height=Math.round(h*s2);c.getContext("2d").drawImage(img,0,0,c.width,c.height);done({data:c.toDataURL("image/jpeg",0.8),w:w,h:h})}catch(e){toast("Couldn’t use that image.")}}
  };
  img.onerror=function(){toast("That file isn’t an image this browser can read.")};
  img.src=url;
});

/* ---------------- Tabs & render ---------------- */
var TABS=["map","zones","care","log"];
function go(t){ui.tab=t;saveUi();if(location.hash!=="#"+t)history.replaceState(null,"","#"+t);closeSheet();render();if(t==="map")requestAnimationFrame(function(){if(!M.vb)fit();else drawMap()});window.scrollTo(0,0)}
document.querySelector("nav.tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(b)go(b.getAttribute("data-tab"))});
window.addEventListener("hashchange",function(){var t=location.hash.slice(1);if(TABS.indexOf(t)>=0&&t!==ui.tab)go(t)});
var lastBg="";
function render(){
  $("yardName").textContent=P("yardName","Our Yard");
  TABS.forEach(function(t){$("v-"+t).hidden=ui.tab!==t});
  document.querySelectorAll("nav.tabs [data-tab]").forEach(function(b){if(b.getAttribute("data-tab")===ui.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(ui.tab==="map"){
    renderZoneFilter();renderMapEmpty();
    var bg=JSON.stringify(world());if(bg!==lastBg){lastBg=bg;if(M.vb)fit()}
    drawMap();
    if(sheetFor&&S.items[sheetFor]===undefined&&sheetFor.indexOf(":")<0&&sheetFor!=="settings")closeSheet();
  }
  if(ui.tab==="zones")renderZones();
  if(ui.tab==="care")renderCare();
  if(ui.tab==="log")renderLog();
}
window.addEventListener("resize",function(){if(ui.tab==="map")drawMap()});

lsRead();
var h0=location.hash.slice(1);if(TABS.indexOf(h0)>=0)ui.tab=h0;
renderTools();renderCtx();renderLayers();footer();
lastBg=JSON.stringify(world());
render();
if(ui.tab==="map")requestAnimationFrame(fit);
connect();
</script>
